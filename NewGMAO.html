    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --accent: #e8970a; --success: #3fb950; --warning: #d29922;
      --danger: #f85149; --info: #58a6ff;

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* NAV BAS */
    #nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
    #nav::-webkit-scrollbar { display: none; }
    .ni { flex: 1 0 auto; min-width: 60px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 9px; font-family: -apple-system, sans-serif; letter-spacing: 0.02em; position: relative; }
    .ni.on { color: var(--accent); }
    .ni-ic { font-size: 23px; line-height: 1; }
    .nb { position: absolute; top: 5px; right: calc(50% - 16px); background: var(--danger); color: #fff; border-radius: 10px; font-size: 9px; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }

    /* HEADER PAGE */
    .ph { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); }
    .pt { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .ps { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin: 0 14px 12px; }
    .ci { padding: 13px 14px; border-bottom: 1px solid var(--border)22; display: flex; align-items: center; gap: 11px; cursor: pointer; -webkit-user-select: none; }
    .ci:last-child { border-bottom: none; }
    .ci:active { background: var(--surface2); }

    /* KPI */
    .kg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
    .kc { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px; }

    .kl { font-size: 12px; font-weight: 600; }
    .ks { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

    /* SEARCH */
    .sc { padding: 10px 14px 0; position: sticky; top: 68px; background: var(--bg); z-index: 9; }
    .si { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px 14px; font-size: 15px; font-family: -apple-system, sans-serif; outline: none; }
    .si::placeholder { color: var(--muted); }

    /* FAB */
    .fab { position: fixed; right: 18px; bottom: calc(68px + env(safe-area-inset-bottom) + 10px); width: 54px; height: 54px; border-radius: 27px; background: var(--accent); border: none; color: #000; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 18px rgba(232,151,10,.45); z-index: 20; font-weight: 300; }

    /* CHIPS FILTRE */
    .chips { display: flex; gap: 7px; padding: 10px 14px 8px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; padding: 6px 13px; border-radius: 100px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: -apple-system, sans-serif; white-space: nowrap; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #000; }

    /* MODAL BOTTOM SHEET */
    .mo { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50; display: flex; align-items: flex-end; animation: fi .2s ease; }

    #install-tip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; margin-left: auto; }

    hr.div { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 12px; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .sp { height: 88px; }
  </style>
</head>

<script>
// ═══════════════════════════════════
// CONSTANTES & HELPERS
// ═══════════════════════════════════
const C = { accent:'#e8970a', success:'#3fb950', warning:'#d29922', danger:'#f85149', info:'#58a6ff', muted:'#8b949e', text:'#e6edf3' };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const today = () => new Date().toISOString().split('T')[0];
const isOverdue = d => d && new Date(d) < new Date();
const daysUntil = d => d ? Math.ceil((new Date(d) - new Date()) / 86400000) : null;
const fmt = d => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const statusCol = s => ({'en service':C.success,'en panne':C.danger,'en maintenance':C.warning,'hors service':C.muted,'ouvert':C.info,'en cours':C.warning,'terminé':C.success,'annulé':C.muted}[s]||C.muted);
const prioCol   = p => ({'urgent':C.danger,'haute':'#ff9580','normale':C.info,'basse':C.muted}[p]||C.muted);
const badge     = (l,col) => `<span class="badge" style="color:${col};background:${col}22;border:1px solid ${col}44">${esc(l)}</span>`;
const eqIcon    = t => ({'électrique':'⚡','hydraulique':'💧','pneumatique':'💨','mécanique':'⚙','thermique':'🔥'}[t]||'🔧');

const nextOT = ots => {
  const n = ots.map(o => parseInt(o.numero?.replace('OT-','')||'0')).filter(x=>!isNaN(x));
  return `OT-${String((n.length?Math.max(...n):0)+1).padStart(3,'0')}`;
};

// Mapping camelCase JS ⇄ snake_case DB
const camelToSnake = {
  equipementId: 'equipement_id',
  dateMAJ: 'date_maj',
  dateCreation: 'date_creation',
  datePrevue: 'date_prevue',
  dateCloture: 'date_cloture',
  dateDebut: 'date_debut',
  dateFin: 'date_fin',
  dureeH: 'duree_h',
  coutMO: 'cout_mo',
  coutPieces: 'cout_pieces',
  coutTotal: 'cout_total',
  dernierPassage: 'dernier_passage',
  prochaineEcheance: 'prochaine_echeance',
  seuilAlerte: 'seuil_alerte',
  prixUnitaire: 'prix_unitaire',
  otId: 'ot_id',
  pieceId: 'piece_id',
  parentType: 'parent_type',
  parentId: 'parent_id',
  typeFichier: 'type_fichier',
  storagePath: 'storage_path',
  dateAjout: 'date_ajout',
};
const snakeToCamel = Object.fromEntries(Object.entries(camelToSnake).map(([k,v])=>[v,k]));

const toDB = (obj) => {
  const out = {};
  for (const [k,v] of Object.entries(obj)) out[camelToSnake[k] || k] = v;
  return out;
};
const fromDB = (obj) => {
  const out = {};
  for (const [k,v] of Object.entries(obj)) {
    if (k === 'updated_at') continue;
    out[snakeToCamel[k] || k] = v;
  }
  return out;
};

const TABLES = { eq: 'equipements', ots: 'ots', prev: 'preventif', stock: 'stock', otPieces: 'ot_pieces', settings: 'settings', docs: 'documents' };

// Chargement initial depuis Supabase
async function loadFromCloud() {
  if (!cloudEnabled) throw new Error('Cloud désactivé');
  const load = async (table) => {
    try {
      const { data, error } = await sb.from(table).select('*');
      if (error) { console.warn(`Load ${table}:`, error.message); return []; }
      return (data || []).map(fromDB);
    } catch(e) { console.warn(`Load ${table} exception:`, e); return []; }
  };
  const [eq, ots, prev, stock, otPieces, settings, docs] = await Promise.all([
    load('equipements'), load('ots'), load('preventif'), load('stock'),
    load('ot_pieces'), load('settings'), load('documents'),
  ]);
  return { eq, ots, prev, stock, otPieces, settings, docs };
}

// Upsert (création ou mise à jour) d'une ligne
async function upsertRow(tableKey, row) {
  if (!cloudEnabled) return;
  const { error } = await sb.from(TABLES[tableKey]).upsert(toDB(row));
  if (error) console.error('Upsert:', error);
}

// Suppression
async function deleteRow(tableKey, id) {
  if (!cloudEnabled) return;
  const { error } = await sb.from(TABLES[tableKey]).delete().eq('id', id);
  if (error) console.error('Delete:', error);
}

// Subscribe temps réel : écoute les changements sur toutes les tables
let realtimeChannels = [];
function subscribeAll() {
  if (!cloudEnabled) return;
  // Nettoyer les canaux existants
  realtimeChannels.forEach(ch => { try { sb.removeChannel(ch); } catch(e) {} });
  realtimeChannels = [];
  const tables = ['equipements', 'ots', 'preventif', 'stock', 'ot_pieces', 'settings', 'documents'];
  const keys =   ['eq',          'ots', 'prev',       'stock', 'otPieces',  'settings', 'docs'];
  tables.forEach((table, i) => {
    try {
      const ch = sb.channel(`rt-${table}-${Date.now()}`)
        .on('postgres_changes', { event: '*', schema: 'public', table }, async () => {
          try {
            const { data } = await sb.from(table).select('*');
            if (data) { S[keys[i]] = data.map(fromDB); render(); }
          } catch(e) { console.warn(`Realtime ${table}:`, e); }
        })
        .subscribe();
      realtimeChannels.push(ch);
    } catch(e) { console.warn(`Subscribe ${table}:`, e); }
  });
}

// ═══════════════════════════════════
// STORAGE local (fallback hors-ligne uniquement)
// ═══════════════════════════════════
const lsLoad = (k,fb) => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;} };
const lsSave = (k,d) => { try{localStorage.setItem(k,JSON.stringify(d));}catch{} };

// ═══════════════════════════════════
// DEMO DATA

const ID1='eq-001',ID2='eq-002',ID3='eq-003';

  {id:uid(),numero:'OT-002',titre:'Vidange + filtre compresseur',equipementId:ID1,type:'préventif',priorite:'normale',statut:'ouvert',description:'Vidange huile 2000h',dateCreation:'2026-05-10',datePrevue:'2026-05-22',dateCloture:'',technicien:'Pierre',observations:''},
];

  {id:uid(),equipementId:ID3,tache:'Contrôle connexions électriques',frequence:'annuel',dernierPassage:'2025-12-01',prochaineEcheance:'2026-12-01',technicien:'Pierre',observations:''},
  {id:uid(),equipementId:ID2,tache:'Contrôle niveau huile',frequence:'mensuel',dernierPassage:'2026-04-15',prochaineEcheance:'2026-05-15',technicien:'Pierre',observations:''},

const DEMO_STOCK=[
  {id:uid(),reference:'JT-32X3',designation:'Joint torique 32×3 NBR',categorie:'Joints',quantite:5,seuilAlerte:3,localisation:'Rayonnage A-12',fournisseur:'Rubix',prixUnitaire:2.50,observations:''},
  {id:uid(),reference:'FLT-AIR-01',designation:'Filtre à air compresseur GA15',categorie:'Filtration',quantite:1,seuilAlerte:2,localisation:'Rayonnage B-03',fournisseur:'Atlas Copco',prixUnitaire:45.00,observations:''},
  {id:uid(),reference:'HUI-HYD-46',designation:'Huile hydraulique ISO 46 (5L)',categorie:'Lubrifiants',quantite:8,seuilAlerte:4,localisation:'Stockage huiles',fournisseur:'Total',prixUnitaire:32.00,observations:''},
];

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
const S = {
  page:'dashboard',
  eq: [], ots: [], prev: [], stock: [], otPieces: [], settings: [], docs: [],
  search:{eq:'',ots:'',prev:'',stock:''},
  otFilter:'all',
  statsPeriod: '30',  // jours
  loading: true,
  online: navigator.onLine,
};

// Helper pour récupérer un setting
const getSetting = (key, fallback='') => {
  const s = S.settings.find(x => x.key === key);
  return s ? s.value : fallback;
};
const setSetting = async (key, value) => {
  let s = S.settings.find(x => x.key === key);
  if (s) { s.value = value; S.settings = S.settings.map(x => x.id===s.id?s:x); }
  else { s = { id: 's-' + uid(), key, value }; S.settings = [...S.settings, s]; }
  await syncSave('settings', s);
};

// Tracker écritures en cours pour éviter d'écraser une saisie utilisateur
let writesPending = 0;

// Mise à jour optimiste + sync cloud
async function syncSave(tableKey, row) {
  writesPending++;
  // 1. Mise à jour locale immédiate (déjà faite par l'appelant)
  // 2. Sauvegarde dans le cloud
  try { await upsertRow(tableKey, row); }
  catch(e) { console.error('Sync save:', e); }
  finally { writesPending--; }
  // 3. Cache local de secours
  lsSave(`gmao-${tableKey}`, S[tableKey]);
}

async function syncDelete(tableKey, id) {
  writesPending++;
  try { await deleteRow(tableKey, id); }
  catch(e) { console.error('Sync delete:', e); }
  finally { writesPending--; }
  lsSave(`gmao-${tableKey}`, S[tableKey]);
}

// Anciennes fonctions conservées pour compatibilité (cache local)
function saveAll() {
  lsSave('gmao-eq', S.eq);
  lsSave('gmao-ot', S.ots);
  lsSave('gmao-prev', S.prev);
  lsSave('gmao-stock', S.stock);
  lsSave('gmao-otPieces', S.otPieces);
  lsSave('gmao-settings', S.settings);
  lsSave('gmao-docs', S.docs);
}

// ═══════════════════════════════════
// NAV
// ═══════════════════════════════════
const TABS=[
  {id:'dashboard',ic:'◈',lb:'Accueil'},
  {id:'equipements',ic:'⚙',lb:'Machines'},
  {id:'ots',ic:'🔧',lb:'OT'},
  {id:'preventif',ic:'📅',lb:'Prév.'},
  {id:'stock',ic:'📦',lb:'Stock'},
  {id:'stats',ic:'📊',lb:'Stats'},
  {id:'settings',ic:'⚙️',lb:'Régl.'},
];

function renderNav() {
  const oA = S.ots.filter(o=>!['terminé','annulé'].includes(o.statut)&&(o.priorite==='urgent'||isOverdue(o.datePrevue))).length;
  const sA = S.stock.filter(s=>s.quantite<=s.seuilAlerte).length;
  const pA = S.prev.filter(p=>{const d=daysUntil(p.prochaineEcheance);return d!==null&&d<=7;}).length;
  const al = {dashboard:oA+sA+pA,ots:oA,stock:sA,preventif:pA};

  document.getElementById('nav').innerHTML = TABS.map(t => {
    const a = al[t.id]||0;
    return `<button class="ni ${S.page===t.id?'on':''}" onclick="go('${t.id}')">
      <span class="ni-ic">${t.ic}</span>
      <span>${t.lb}</span>
      ${a>0?`<span class="nb">${a}</span>`:''}
    </button>`;
  }).join('');
}

function go(page) { S.page=page; render(); }

// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════
function render() {
  renderNav();
  const wasFocused = document.activeElement?.classList.contains('si');
  const focusedId = document.activeElement?.id;
  const focusedVal = document.activeElement?.value;

  const fn = {dashboard:pgDashboard,equipements:pgEquipements,ots:pgOTs,preventif:pgPreventif,stock:pgStock,stats:pgStats,settings:pgSettings};
  document.getElementById('content').innerHTML = (fn[S.page]||pgDashboard)();

  // Restore search focus after re-render
  if (wasFocused && focusedId) {
    const el = document.getElementById(focusedId);
    if (el) { el.focus(); el.setSelectionRange && el.setSelectionRange(el.value.length,el.value.length); }
  }
}

// ═══════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════
function pgDashboard() {
  const actifs = S.ots.filter(o=>!['terminé','annulé'].includes(o.statut));
  const retards = actifs.filter(o=>isOverdue(o.datePrevue));
  const urgents = actifs.filter(o=>o.priorite==='urgent');
  const prev30 = S.prev.filter(p=>{const d=daysUntil(p.prochaineEcheance);return d!==null&&d<=30;});
  const sAlt = S.stock.filter(s=>s.quantite<=s.seuilAlerte);
  const pannes = S.eq.filter(e=>e.statut==='en panne');

  const kpi = (v,l,s,col) => `
    <div class="kc" style="border-left:3px solid ${col}">
      <div class="kv" style="color:${col}">${v}</div>
      <div class="kl">${l}</div>
      ${s?`<div class="ks">${s}</div>`:''}
    </div>`;

  const otRow = ot => {
    const eq=S.eq.find(e=>e.id===ot.equipementId);
    return `<div class="ci">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          <span class="mono" style="color:var(--accent)">${esc(ot.numero)}</span> ${esc(ot.titre)}
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(eq?.nom||'—')} · ${fmt(ot.datePrevue)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0">
        ${badge(ot.priorite,prioCol(ot.priorite))}
        ${isOverdue(ot.datePrevue)?badge('retard',C.danger):''}
      </div>
    </div>`;
  };

  const prevRow = p => {
    const eq=S.eq.find(e=>e.id===p.equipementId);
    const d=daysUntil(p.prochaineEcheance);
    const col=d<=0?C.danger:d<=7?C.warning:C.info;
    return `<div class="ci">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${esc(p.tache)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(eq?.nom||'—')} · ${p.frequence}</div>
      </div>
      <div style="color:${col};font-family:monospace;font-size:12px;text-align:right;flex-shrink:0">
        ${fmt(p.prochaineEcheance)}<br><span style="font-size:10px">${d<=0?`RETARD ${Math.abs(d)}j`:`J-${d}`}</span>
      </div>
    </div>`;
  };

  return `
    <div class="ph">
      <div>
        <div class="pt">Tableau de bord</div>
        <div class="ps">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
      </div>
    </div>

    <div class="kg">
      ${kpi(S.eq.length,'Équipements',pannes.length?`${pannes.length} en panne`:'Tous opérationnels',pannes.length?C.danger:C.success)}
      ${kpi(actifs.length,'OT actifs',retards.length?`${retards.length} en retard`:urgents.length?`${urgents.length} urgent(s)`:'OK',(urgents.length||retards.length)?C.danger:C.warning)}
      ${kpi(prev30.length,'Maintenances 30j',prev30.filter(p=>daysUntil(p.prochaineEcheance)<=7).length+' sous 7j',prev30.filter(p=>daysUntil(p.prochaineEcheance)<=7).length?C.danger:C.info)}
      ${kpi(sAlt.length,'Alertes stock',sAlt.length?'Réappro nécessaire':'Stock OK',sAlt.length?C.warning:C.success)}
    </div>

    ${actifs.length?`<div class="st">OT EN COURS</div><div class="card">${actifs.slice(0,5).map(otRow).join('')}</div>`:''}
    ${prev30.length?`<div class="st">MAINTENANCES À VENIR</div><div class="card">${[...prev30].sort((a,b)=>new Date(a.prochaineEcheance)-new Date(b.prochaineEcheance)).slice(0,5).map(prevRow).join('')}</div>`:''}
    ${sAlt.length?`
    <div class="st" style="color:${C.warning}">⚠ ALERTES STOCK</div>
    <div class="card" style="border-left:3px solid ${C.warning}">
      ${sAlt.map(s=>`<div class="ci">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600">${esc(s.designation)}</div>
          <div style="font-size:11px;color:var(--muted)">${esc(s.reference)} · ${esc(s.localisation)}</div>
        </div>
        <div style="color:${C.warning};font-family:monospace;font-size:18px;font-weight:700">${s.quantite}<span style="color:var(--muted);font-size:11px">/${s.seuilAlerte}</span></div>
      </div>`).join('')}
    </div>`:''}
    <div class="sp"></div>`;
}

function saveEq(id) {
  const nom = document.getElementById('en').value.trim();
  if (!nom) { alert('Désignation obligatoire'); return; }
  const d = {nom,type:document.getElementById('et').value,statut:document.getElementById('es').value,localisation:document.getElementById('el').value,dateMAJ:document.getElementById('ed').value,observations:document.getElementById('eo').value};
  const row = id ? {...S.eq.find(e=>e.id===id), ...d} : {id:uid(), ...d};
  if (id) S.eq=S.eq.map(e=>e.id===id?row:e);
  else S.eq=[...S.eq, row];
  syncSave('eq', row); closeModal(); render();
}

function delEq(id) {
  if (!confirm('Supprimer ?')) return;
  S.eq=S.eq.filter(e=>e.id!==id);
  syncDelete('eq', id); closeModal(); render();
}

// Affiche la version imprimable EN PLEIN ÉCRAN dans l'app (compatible iPhone PWA)
// Bouton "Fermer" toujours visible pour revenir à l'app
function showPrintView(htmlContent, title) {
  // Container plein écran
  const overlay = document.createElement('div');
  overlay.id = 'print-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:200;overflow:auto;-webkit-overflow-scrolling:touch';

  overlay.innerHTML = `
    <div style="position:sticky;top:0;background:#0d1117;color:#fff;padding:max(env(safe-area-inset-top),12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #30363d;z-index:10">
      <div style="font-size:14px;font-weight:600;color:#fff">${esc(title)}</div>
      <div style="display:flex;gap:8px">
        <button onclick="window.print()" style="background:#e8970a;border:none;color:#000;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer">🖨 Imprimer</button>
        <button onclick="closePrintView()" style="background:#30363d;border:none;color:#fff;font-size:18px;width:32px;height:32px;border-radius:16px;cursor:pointer;line-height:1">×</button>
      </div>
    </div>
    <div id="print-content">${htmlContent}</div>
    <style>
      @media print {
        #print-overlay > div:first-child { display: none !important; }
        body * { visibility: hidden; }
        #print-overlay, #print-overlay * { visibility: visible; }
        #print-overlay { position: absolute; inset: 0; }
      }
    </style>
  `;
  document.body.appendChild(overlay);
}

function closePrintView() {
  const el = document.getElementById('print-overlay');
  if (el) el.remove();
}

    </div>`);

  // Lancer après que le DOM soit prêt
  setTimeout(() => startScanner(), 100);
}

async function startScanner() {
  const stEl=document.getElementById('scan-st');
  const vid=document.getElementById('scan-vid');
  const cv=document.getElementById('scan-cv');
  if (!vid||!cv) return;

  // jsQR doit déjà être chargé via le <script> du head
  // Si jamais il manque, on essaie de le charger
  if (!window.jsQR) {
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    document.head.appendChild(s);
  }

  // Vérifier que l'API caméra existe
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (stEl) stEl.innerHTML=`<span style="color:${C.danger}">⚠ API caméra non disponible sur ce navigateur</span>`;
    return;
  }

  // Demander la caméra
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
  } catch(e1) {
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch(e2) {
      if (stEl) {
        if (e2.name === 'NotAllowedError') {
          stEl.innerHTML = `<span style="color:${C.danger}">⚠ Accès caméra refusé. Réglages iPhone → GMAO → Caméra.</span>`;
        } else if (e2.name === 'NotFoundError') {
          stEl.innerHTML = `<span style="color:${C.danger}">⚠ Aucune caméra détectée</span>`;
        } else {
          stEl.innerHTML = `<span style="color:${C.danger}">⚠ Caméra non disponible (${e2.name})</span>`;
        }
      }
      return;
    }
  }

  // Brancher le flux vidéo
  try {
    vid.srcObject = scanStream;
    vid.setAttribute('playsinline', 'true');
    vid.setAttribute('muted', 'true');
    await vid.play();
    if (stEl) stEl.textContent = 'Pointez vers un QR code GMAO';
  } catch(e) {
    if (stEl) stEl.innerHTML = `<span style="color:${C.danger}">⚠ Lecture vidéo impossible</span>`;
    stopScanner();
    return;
  }

  scanTick(vid, cv);
}

function scanTick(vid,cv) {
  if (!vid || !cv) return;

  // Si jsQR pas encore chargé, attendre
  if (!window.jsQR) {
    const stEl = document.getElementById('scan-st');
    if (stEl && stEl.textContent !== 'Chargement du décodeur QR…') {
      stEl.textContent = 'Chargement du décodeur QR…';
    }
    scanRAF = requestAnimationFrame(() => scanTick(vid, cv));
    return;
  }

  if (vid.readyState >= vid.HAVE_ENOUGH_DATA && vid.videoWidth > 0) {
    cv.width = vid.videoWidth;
    cv.height = vid.videoHeight;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(vid, 0, 0, cv.width, cv.height);
    const img = ctx.getImageData(0, 0, cv.width, cv.height);

    // Essai 1 : décodage normal
    let code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });

    if (code && code.data) {
      const eqId = parseQR(code.data);
      if (eqId) {
        const eq = S.eq.find(e => e.id === eqId);
        if (eq) {
          stopScanner();
          showScanResult(eq);
          return;
        } else {
          // QR scanné mais équipement introuvable dans la base
          const stEl = document.getElementById('scan-st');
          if (stEl) stEl.innerHTML = `<span style="color:${C.warning}">⚠ QR reconnu mais équipement introuvable</span>`;
        }
      } else {
        // QR détecté mais pas un QR GMAO
        const stEl = document.getElementById('scan-st');
        if (stEl) stEl.innerHTML = `<span style="color:${C.warning}">⚠ Ce n'est pas un QR de cette GMAO</span>`;
      }
    }
  }
  scanRAF = requestAnimationFrame(() => scanTick(vid, cv));
}

function stopScanner() {
  if (scanStream) { scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF=null; }
}

function closeScanner() { stopScanner(); closeModal(); }

function saveQuickPreventif(eqId) {
  const tech = document.getElementById('qpv-tech').value;
  const list = S.prev.filter(p => p.equipementId === eqId);
  let count = 0;
  list.forEach(p => {
    const cb = document.getElementById('qpv-'+p.id);
    if (cb && cb.checked) {
      const d = new Date(); d.setDate(d.getDate()+(FREQ_DAYS[p.frequence]||30));
      const updated = {...p, dernierPassage:today(), prochaineEcheance:d.toISOString().split('T')[0]};
      if (tech) updated.technicien = tech;
      S.prev = S.prev.map(x=>x.id===p.id?updated:x);
      syncSave('prev', updated);
      count++;
    }
  });
  closeModal();
  if (count) showToast(`${count} gamme(s) validée(s)`, C.success);
  render();
}

// Recalcule le coût MO en temps réel
function updateCoutMO() {
  const tarifH = Number(getSetting('tarif_horaire', '45')) || 45;
  const duree = Number(document.getElementById('otdh').value) || 0;
  const cmo = (duree * tarifH).toFixed(2);
  const elMO = document.getElementById('otcmo');
  if (elMO) elMO.value = cmo;
  const elCP = document.getElementById('otcp');
  const cp = elCP ? Number(elCP.value)||0 : 0;
  const elCT = document.getElementById('otct');
  if (elCT) elCT.value = (Number(cmo) + cp).toFixed(2);
}

function saveOT(id) {
  const titre=document.getElementById('ott').value.trim();
  if (!titre) { alert('Titre obligatoire'); return; }
  const dureeH = Number(document.getElementById('otdh')?.value)||0;
  const coutMO = Number(document.getElementById('otcmo')?.value)||0;
  const coutPieces = Number(document.getElementById('otcp')?.value)||0;
  const coutTotal = coutMO + coutPieces;
  const d={titre,equipementId:document.getElementById('oteq').value,type:document.getElementById('otty').value,priorite:document.getElementById('otpr').value,statut:document.getElementById('otst').value,technicien:document.getElementById('ottech').value,datePrevue:document.getElementById('otd').value,dateCloture:document.getElementById('otc').value,dateDebut:document.getElementById('otdd')?.value||'',dateFin:document.getElementById('otdf')?.value||'',dureeH,coutMO,coutPieces,coutTotal,description:document.getElementById('otdes').value,observations:document.getElementById('otob').value};
  const row = id ? {...S.ots.find(o=>o.id===id), ...d} : {id:uid(), numero:nextOT(S.ots), dateCreation:today(), ...d};
  if (id) S.ots=S.ots.map(o=>o.id===id?row:o);
  else S.ots=[...S.ots, row];
  syncSave('ots', row); closeModal(); render();
}

function openAddPiece(otId) {
  const stocks = S.stock.filter(s => s.quantite > 0);
  if (stocks.length === 0) { alert('Aucune pièce disponible en stock'); return; }
  openModal(`
    <div class="mh"></div>
    <div class="mhd"><span class="mt">+ Ajouter une pièce</span><button class="mc" onclick="closeModal();modalOT('${otId}')">×</button></div>
    <div class="mb">
      <div class="fi"><label class="fl">Pièce *</label><select class="sel" id="ap-id" onchange="updateAPInfo()">
        <option value="">— Sélectionner —</option>
        ${stocks.map(s => `<option value="${s.id}">${esc(s.designation)} (${s.reference}) · stock: ${s.quantite}</option>`).join('')}
      </select></div>
      <div class="g2">
        <div class="fi"><label class="fl">Quantité</label><input class="inp" type="number" min="0.01" step="0.01" id="ap-qte" value="1"/></div>
        <div class="fi"><label class="fl">Prix unit. (€)</label><input class="inp" type="number" min="0" step="0.01" id="ap-pu" value="0"/></div>
      </div>
      <div id="ap-warn" style="font-size:11px;color:var(--muted);margin-bottom:10px"></div>
      <button class="bp" onclick="saveOTPiece('${otId}')">Ajouter au OT</button>
      <button class="bs" style="width:100%;margin-top:8px" onclick="closeModal();modalOT('${otId}')">Annuler</button>
    </div>
  `);
}

function updateAPInfo() {
  const id = document.getElementById('ap-id').value;
  const s = S.stock.find(x => x.id === id);
  if (s) {
    document.getElementById('ap-pu').value = Number(s.prixUnitaire||0).toFixed(2);
    document.getElementById('ap-warn').innerHTML = `Stock dispo : <strong style="color:${C.success}">${s.quantite}</strong>`;
  }
}

function saveOTPiece(otId) {
  const pieceId = document.getElementById('ap-id').value;
  if (!pieceId) { alert('Sélectionnez une pièce'); return; }
  const qte = Number(document.getElementById('ap-qte').value)||0;
  const pu = Number(document.getElementById('ap-pu').value)||0;
  if (qte <= 0) { alert('Quantité invalide'); return; }
  const stk = S.stock.find(s=>s.id===pieceId);
  if (!stk) return;
  if (qte > stk.quantite) {
    if (!confirm(`Stock insuffisant (${stk.quantite} dispo). Continuer quand même ?`)) return;
  }
  // Créer la liaison
  const row = { id: uid(), otId, pieceId, quantite: qte, prixUnitaire: pu };
  S.otPieces = [...S.otPieces, row];
  syncSave('otPieces', row);
  // Décrémenter le stock
  const newStk = {...stk, quantite: Math.max(0, stk.quantite - qte)};
  S.stock = S.stock.map(s=>s.id===pieceId?newStk:s);
  syncSave('stock', newStk);
  closeModal();
  modalOT(otId); // Rouvrir l'OT avec la pièce ajoutée
}

function removeOTPiece(linkId, otId) {
  if (!confirm('Retirer cette pièce ? (le stock sera rétabli)')) return;
  const link = S.otPieces.find(p=>p.id===linkId);
  if (!link) return;
  // Restituer au stock
  const stk = S.stock.find(s=>s.id===link.pieceId);
  if (stk) {
    const newStk = {...stk, quantite: stk.quantite + link.quantite};
    S.stock = S.stock.map(s=>s.id===link.pieceId?newStk:s);
    syncSave('stock', newStk);
  }
  S.otPieces = S.otPieces.filter(p=>p.id!==linkId);
  syncDelete('otPieces', linkId);
  closeModal();
  modalOT(otId);
}

function delOT(id) {
  if (!confirm('Supprimer ?')) return;
  S.ots=S.ots.filter(o=>o.id!==id);
  syncDelete('ots', id); closeModal(); render();
}

const BUCKET = 'gmao-files';

// Upload d'un fichier vers Supabase Storage
async function uploadFile(file, parentType, parentId) {
  if (!cloudEnabled) {
    alert('Cloud non disponible. Connexion requise pour uploader des documents.');
    return null;
  }
  // Limite : 10 Mo
  if (file.size > 10 * 1024 * 1024) {
    alert('Fichier trop volumineux (max 10 Mo)');
    return null;
  }
  // Nom unique
  const ext = file.name.split('.').pop();
  const path = `${parentType}/${parentId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;

  showToast('Upload en cours…', '#58a6ff');
  const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file);
  if (upErr) {
    console.error('Upload:', upErr);
    showToast('Erreur upload: ' + upErr.message, '#f85149');
    return null;
  }
  // URL publique
  const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
  const doc = {
    id: uid(),
    parentType,
    parentId,
    nom: file.name,
    typeFichier: file.type || ext,
    taille: file.size,
    url: urlData.publicUrl,
    storagePath: path,
    dateAjout: today(),
  };
  S.docs = [...S.docs, doc];
  await syncSave('docs', doc);
  showToast('Document ajouté', '#3fb950');
  return doc;
}

async function deleteDoc(docId) {
  if (!confirm('Supprimer ce document ?')) return;
  const doc = S.docs.find(d => d.id === docId);
  if (!doc) return;
  if (cloudEnabled && doc.storagePath) {
    await sb.storage.from(BUCKET).remove([doc.storagePath]);
  }
  S.docs = S.docs.filter(d => d.id !== docId);
  await syncDelete('docs', docId);
  showToast('Document supprimé', '#3fb950');
  return true;
}

// Renvoie une icône selon le type de fichier
const docIcon = (type, nom) => {
  const ext = (nom || '').split('.').pop().toLowerCase();
  if (/pdf/i.test(type) || ext === 'pdf') return '📄';
  if (/image|jpe?g|png|gif|webp|heic/i.test(type) || /jpe?g|png|gif|webp|heic/i.test(ext)) return '🖼️';
  if (/word|doc/i.test(type) || /docx?$/.test(ext)) return '📝';
  if (/excel|sheet|csv/i.test(type) || /xlsx?|csv$/.test(ext)) return '📊';
  if (/video/i.test(type) || /mp4|mov|avi/i.test(ext)) return '🎬';
  return '📎';
};

const fmtSize = (b) => {
  if (b < 1024) return b + ' o';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' Ko';
  return (b/1024/1024).toFixed(1) + ' Mo';
};

// Render une section "Documents" attachée à un parent (equipement ou OT)
function renderDocsSection(parentType, parentId) {
  const list = S.docs.filter(d => d.parentType === parentType && d.parentId === parentId);
  const rows = list.length === 0
    ? `<div style="padding:14px;color:var(--muted);font-size:12px;text-align:center;font-style:italic">Aucun document</div>`
    : list.map(d => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)22">
          <div style="font-size:22px;flex-shrink:0">${docIcon(d.typeFichier, d.nom)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.nom)}</div>
            <div style="font-size:11px;color:var(--muted)">${fmtSize(d.taille||0)} · ${fmt(d.dateAjout)}</div>
          </div>
          <a href="${d.url}" target="_blank" rel="noopener" style="background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);color:${C.info};font-size:11px;padding:5px 10px;border-radius:6px;text-decoration:none;font-weight:600">Ouvrir</a>
          <button onclick="onDeleteDoc('${d.id}','${parentType}','${parentId}')" style="background:transparent;border:1px solid ${C.danger}44;color:${C.danger};font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer">✕</button>
        </div>`).join('');
  return `
    <div id="docs-section-${parentType}-${parentId}">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <span>📎 DOCUMENTS (${list.length})</span>
      </div>
      <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px">${rows}</div>
      <input type="file" id="file-input-${parentType}-${parentId}" style="display:none" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" onchange="onFilePicked(event,'${parentType}','${parentId}')"/>
      <button onclick="document.getElementById('file-input-${parentType}-${parentId}').click()" style="background:rgba(232,151,10,.12);border:1px solid rgba(232,151,10,.35);color:${C.accent};font-size:13px;font-weight:700;padding:9px;border-radius:8px;cursor:pointer;width:100%;font-family:-apple-system,sans-serif">+ Ajouter un document</button>
    </div>
  `;
}

async function onFilePicked(event, parentType, parentId) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';  // reset input
  await uploadFile(file, parentType, parentId);
  // Re-render la section
  const container = document.getElementById(`docs-section-${parentType}-${parentId}`);
  if (container) container.outerHTML = renderDocsSection(parentType, parentId);
}

async function onDeleteDoc(docId, parentType, parentId) {
  const ok = await deleteDoc(docId);
  if (ok) {
    const container = document.getElementById(`docs-section-${parentType}-${parentId}`);
    if (container) container.outerHTML = renderDocsSection(parentType, parentId);
  }
}

function pgPreventif() {
  const q=S.search.prev.toLowerCase();
  const list=[...S.prev].filter(p=>{
    const eq=S.eq.find(e=>e.id===p.equipementId);
    return p.tache.toLowerCase().includes(q)||eq?.nom.toLowerCase().includes(q);
  }).sort((a,b)=>new Date(a.prochaineEcheance)-new Date(b.prochaineEcheance));

  return `
    <div class="ph">
      <div><div class="pt">Plan Préventif</div><div class="ps">${list.length} gamme(s)</div></div>
    </div>
    <div class="sc"><input id="pv-search" class="si" placeholder="Rechercher…" value="${esc(S.search.prev)}" oninput="S.search.prev=this.value;render()"/></div>
    ${list.length===0?`<div class="empty"><div class="empty-i">📅</div><div>Aucune gamme préventive</div></div>`:`
    <div class="card" style="margin-top:10px">
      ${list.map(p=>{
        const eq=S.eq.find(e=>e.id===p.equipementId);
        const d=daysUntil(p.prochaineEcheance);
        const col=d===null?C.muted:d<=0?C.danger:d<=7?C.warning:d<=30?C.accent:C.success;
        return `<div class="ci" onclick="modalPrev('${p.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.tache)}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(eq?.nom||'—')}</div>
            <div style="margin-top:5px">${badge(p.frequence,C.info)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:10px">
            <div style="color:${col};font-family:monospace;font-size:13px;font-weight:700">${fmt(p.prochaineEcheance)}</div>
            <div style="color:${col};font-size:10px;margin-top:2px">${d===null?'':d<=0?`RETARD ${Math.abs(d)}j`:`J-${d}`}</div>
            <button class="bs" style="margin-top:7px;font-size:11px;padding:5px 10px" onclick="event.stopPropagation();marquerFait('${p.id}')">✓ Fait</button>
          </div>

      }).join('')}
    </div>`}

  S.prev=S.prev.map(x=>x.id===id?updated:x);
  syncSave('prev', updated); render();

            </div>
            <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.designation)}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(s.localisation)} · ${esc(s.fournisseur)}</div>
          </div>
          <div class="qc" onclick="event.stopPropagation()">
            <button class="qb" onclick="adjStock('${s.id}',-1)">−</button>
            <span class="qv" style="color:${al?C.warning:C.success}">${s.quantite}</span>
            <button class="qb" onclick="adjStock('${s.id}',1)">+</button>
          </div>
        </div>`;
      }).join('')}
    </div>`}
    <div class="sp"></div>
    <button class="fab" onclick="modalSt(null)">+</button>`;
}

function adjStock(id, delta) {
  const item = S.stock.find(s=>s.id===id); if (!item) return;
  const updated = {...item, quantite: Math.max(0, item.quantite+delta)};
  S.stock=S.stock.map(s=>s.id===id?updated:s);
  syncSave('stock', updated); render();
}

function modalSt(id) {
  const s=id?S.stock.find(x=>x.id===id):null;
  const isN=!s;
  const f=s?{...s}:{reference:'',designation:'',categorie:'',quantite:0,seuilAlerte:1,localisation:'',fournisseur:'',prixUnitaire:0,observations:''};

  openModal(`
    <div class="mh"></div>
    <div class="mhd">
      <span class="mt">${isN?'Nouvelle pièce':'Modifier pièce'}</span>
      <button class="mc" onclick="closeModal()">×</button>
    </div>
    <div class="mb">
      <div class="g2">
        <div class="fi"><label class="fl">Référence</label><input class="inp" id="sr" value="${esc(f.reference)}" placeholder="JT-32X3"/></div>
        <div class="fi"><label class="fl">Catégorie</label><input class="inp" id="sc" value="${esc(f.categorie)}" placeholder="Joints…"/></div>
      </div>
      <div class="fi"><label class="fl">Désignation *</label><input class="inp" id="sd" value="${esc(f.designation)}" placeholder="Nom complet de la pièce"/></div>
      <div class="g2">
        <div class="fi"><label class="fl">Fournisseur</label><input class="inp" id="sf" value="${esc(f.fournisseur)}" placeholder="Nom"/></div>
        <div class="fi"><label class="fl">Localisation</label><input class="inp" id="sl" value="${esc(f.localisation)}" placeholder="Rayon A-12"/></div>
      </div>
      <div class="g3">
        <div class="fi"><label class="fl">Qté</label><input class="inp" type="number" min="0" id="sq" value="${f.quantite}"/></div>
        <div class="fi"><label class="fl">Seuil min.</label><input class="inp" type="number" min="0" id="ss" value="${f.seuilAlerte}"/></div>
        <div class="fi"><label class="fl">PU (€)</label><input class="inp" type="number" min="0" step="0.01" id="sp" value="${f.prixUnitaire}"/></div>
      </div>
      <div class="fi"><label class="fl">Observations</label><textarea class="ta" id="so">${esc(f.observations)}</textarea></div>
      ${!isN?`<button class="bd" onclick="delSt('${s.id}')">Supprimer cette pièce</button>`:''}
      <button class="bp" onclick="saveSt('${isN?'':s.id}')">${isN?'Ajouter au stock':'Enregistrer'}</button>
    </div>`);
}

function saveSt(id) {
  const designation=document.getElementById('sd').value.trim();
  if (!designation) { alert('Désignation obligatoire'); return; }
  const d={designation,reference:document.getElementById('sr').value,categorie:document.getElementById('sc').value,fournisseur:document.getElementById('sf').value,localisation:document.getElementById('sl').value,quantite:Number(document.getElementById('sq').value)||0,seuilAlerte:Number(document.getElementById('ss').value)||0,prixUnitaire:Number(document.getElementById('sp').value)||0,observations:document.getElementById('so').value};
  const row = id ? {...S.stock.find(s=>s.id===id), ...d} : {id:uid(), ...d};
  if (id) S.stock=S.stock.map(s=>s.id===id?row:s);
  else S.stock=[...S.stock, row];
  syncSave('stock', row); closeModal(); render();
}

function delSt(id) {
  if (!confirm('Supprimer ?')) return;
  S.stock=S.stock.filter(s=>s.id!==id);
  syncDelete('stock', id); closeModal(); render();
}

// ═══════════════════════════════════
// MODAL SYSTEM
// ═══════════════════════════════════
function openModal(html) {
  closeModal();
  const o=document.createElement('div');
  o.className='mo'; o.id='modal-o';
  o.innerHTML=`<div class="ms">${html}</div>`;
  o.addEventListener('click',e=>{ if(e.target===o){stopScanner();closeModal();} });
  document.body.appendChild(o);
}

function closeModal() {
  const el=document.getElementById('modal-o');
  if (el) { stopScanner(); el.remove(); }
}

// ═══════════════════════════════════
// STATISTIQUES
// ═══════════════════════════════════
function pgStats() {
  const period = Number(S.statsPeriod);
  const now = new Date();
  const cutoff = period > 0 ? new Date(now.getTime() - period*86400000) : new Date(0);

  const otsInPeriod = S.ots.filter(o => {
    if (!o.dateCreation) return false;
    return new Date(o.dateCreation) >= cutoff;
  });
  const otsTermines = otsInPeriod.filter(o => o.statut === 'terminé');
  const otsCorrectifs = otsInPeriod.filter(o => o.type === 'correctif');
  const otsPreventifs = otsInPeriod.filter(o => o.type === 'préventif');

  const dispo = S.eq.length === 0 ? 100 : Math.round((S.eq.filter(e => e.statut === 'en service').length / S.eq.length) * 100);
  const coutTotal = otsInPeriod.reduce((s, o) => s + (Number(o.coutTotal)||0), 0);
  const dureeTotal = otsTermines.reduce((s, o) => s + (Number(o.dureeH)||0), 0);
  const mttr = otsTermines.length > 0 ? (dureeTotal / otsTermines.length).toFixed(1) : 0;

  const pannesParMachine = {};
  otsCorrectifs.forEach(o => {
    if (!pannesParMachine[o.equipementId]) pannesParMachine[o.equipementId] = [];
    if (o.dateCreation) pannesParMachine[o.equipementId].push(new Date(o.dateCreation));
  });
  let totalGap = 0, gapCount = 0;
  Object.values(pannesParMachine).forEach(dates => {
    if (dates.length < 2) return;
    dates.sort((a,b)=>a-b);
    for (let i=1; i<dates.length; i++) {
      totalGap += (dates[i] - dates[i-1]) / 86400000;
      gapCount++;
    }
  });
  const mtbf = gapCount > 0 ? Math.round(totalGap / gapCount) : '—';

  const pannesCount = {};
  otsCorrectifs.forEach(o => {
    pannesCount[o.equipementId] = (pannesCount[o.equipementId]||0) + 1;
  });
  const topMachines = Object.entries(pannesCount)
    .map(([id, n]) => ({ eq: S.eq.find(e=>e.id===id), n }))
    .filter(x => x.eq)
    .sort((a,b) => b.n - a.n)
    .slice(0, 5);

  const moisLabels = [];
  const moisData = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const fin = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
    moisLabels.push(d.toLocaleDateString('fr-FR', { month: 'short' }));
    moisData.push(S.ots.filter(o => {
      if (!o.dateCreation) return false;
      const od = new Date(o.dateCreation);
      return od >= d && od < fin;
    }).length);
  }
  const maxMois = Math.max(...moisData, 1);

  const techCount = {};
  otsInPeriod.forEach(o => {
    const t = (o.technicien||'').trim() || '(non assigné)';
    if (!techCount[t]) techCount[t] = { total:0, termines:0, heures:0 };
    techCount[t].total++;
    if (o.statut === 'terminé') techCount[t].termines++;
    techCount[t].heures += Number(o.dureeH)||0;
  });
  const techRows = Object.entries(techCount).sort((a,b)=>b[1].total-a[1].total).slice(0,6);

  const prevEnRetard = S.prev.filter(p => { const d=daysUntil(p.prochaineEcheance); return d!==null && d<=0; }).length;
  const tauxPrev = S.prev.length === 0 ? 100 : Math.round(((S.prev.length - prevEnRetard) / S.prev.length) * 100);

  const piecesCount = {};
  S.otPieces.forEach(p => {
    if (!piecesCount[p.pieceId]) piecesCount[p.pieceId] = 0;
    piecesCount[p.pieceId] += Number(p.quantite)||0;
  });
  const topPieces = Object.entries(piecesCount)
    .map(([id, n]) => ({ s: S.stock.find(x=>x.id===id), n }))
    .filter(x => x.s)
    .sort((a,b)=>b.n-a.n)
    .slice(0, 5);

  const stockValue = S.stock.reduce((s, x) => s + x.quantite * (x.prixUnitaire||0), 0);
  const stockAlt = S.stock.filter(s => s.quantite <= s.seuilAlerte).length;

  const total = otsInPeriod.length || 1;
  const pctCorr = Math.round((otsCorrectifs.length / total) * 100);
  const pctPrev = Math.round((otsPreventifs.length / total) * 100);
  const pctAutre = 100 - pctCorr - pctPrev;

  const KPI = (val, lbl, sub, col) => `
    <div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${col};border-radius:12px;padding:12px 14px">
      <div style="font-size:26px;font-weight:700;color:${col};line-height:1;font-family:Rajdhani,sans-serif">${val}</div>
      <div style="font-size:12px;font-weight:600;margin-top:5px">${lbl}</div>
      ${sub?`<div style="font-size:10px;color:var(--muted);margin-top:2px">${sub}</div>`:''}
    </div>`;

  return `
    <div class="ph">
      <div>
        <div class="pt">Statistiques</div>
        <div class="ps">${otsInPeriod.length} OT · ${S.eq.length} machine(s)</div>
      </div>
    </div>

    <div class="chips">
      ${[['7','7 jours'],['30','30 jours'],['90','3 mois'],['365','12 mois'],['0','Tout']].map(([v,l]) =>
        `<button class="chip ${S.statsPeriod===v?'on':''}" onclick="S.statsPeriod='${v}';render()">${l}</button>`
      ).join('')}
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:14px 14px 8px">VUE D'ENSEMBLE</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px">
      ${KPI(dispo+'%', 'Disponibilité parc', S.eq.filter(e=>e.statut==='en panne').length+' en panne', dispo>=90?C.success:dispo>=75?C.warning:C.danger)}
      ${KPI(coutTotal.toFixed(0)+'€', 'Coût total période', 'MO + pièces', C.accent)}
      ${KPI(mttr+'h', 'MTTR moyen', 'Durée moy. réparation', C.info)}
      ${KPI(mtbf==='—'?'—':mtbf+'j', 'MTBF moyen', 'Entre pannes', C.success)}
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">RÉPARTITION DES OT</div>
    <div class="card" style="padding:14px">
      <div style="display:flex;height:24px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--bg)">
        <div style="background:${C.danger};width:${pctCorr}%"></div>
        <div style="background:${C.success};width:${pctPrev}%"></div>
        <div style="background:${C.muted};width:${pctAutre}%"></div>
      </div>
      <div style="display:flex;gap:14px;font-size:11px;flex-wrap:wrap">
        <span><span style="color:${C.danger}">●</span> Correctif ${pctCorr}% (${otsCorrectifs.length})</span>
        <span><span style="color:${C.success}">●</span> Préventif ${pctPrev}% (${otsPreventifs.length})</span>
        <span><span style="color:${C.muted}">●</span> Autre ${pctAutre}%</span>
      </div>
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">OT PAR MOIS (12 derniers)</div>
    <div class="card" style="padding:14px">
      <div style="display:flex;align-items:flex-end;gap:4px;height:120px">
        ${moisData.map((v,i) => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
            <div style="font-size:9px;color:var(--muted);height:11px">${v||''}</div>
            <div style="width:100%;background:${v>0?C.accent:'var(--border)'};height:${(v/maxMois)*90}px;min-height:2px;border-radius:3px 3px 0 0"></div>
            <div style="font-size:9px;color:var(--muted)">${moisLabels[i]}</div>
          </div>
        `).join('')}
      </div>
    </div>

    ${topMachines.length > 0 ? `
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">⚠ TOP MACHINES PROBLÉMATIQUES</div>
      <div class="card">
        ${topMachines.map(({eq, n}, i) => `
          <div class="ci" onclick="modalEq('${eq.id}')" style="border-bottom:1px solid var(--border)22">
            <div style="width:28px;height:28px;background:${i===0?C.danger:i===1?'#ff9580':C.warning}33;color:${i===0?C.danger:i===1?'#ff9580':C.warning};border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">${i+1}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(eq.nom)}</div>
              <div style="font-size:11px;color:var(--muted)">📍 ${esc(eq.localisation)}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="color:${C.danger};font-weight:700;font-size:16px">${n}</div>
              <div style="font-size:10px;color:var(--muted)">panne(s)</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    ${techRows.length > 0 ? `
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">👷 CHARGE PAR TECHNICIEN</div>
      <div class="card">
        ${techRows.map(([t, d]) => `
          <div style="padding:11px 14px;border-bottom:1px solid var(--border)22">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <div style="font-size:13px;font-weight:600">${esc(t)}</div>
              <div style="font-size:12px;color:var(--muted)">${d.total} OT · ${d.heures.toFixed(1)}h</div>
            </div>
            <div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden">
              <div style="height:100%;background:${C.success};width:${d.total>0?(d.termines/d.total)*100:0}%"></div>
            </div>
            <div style="font-size:10px;color:var(--muted);margin-top:3px">${d.termines}/${d.total} terminés</div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">📅 PRÉVENTIF</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px">
      ${KPI(tauxPrev+'%', 'Taux à temps', S.prev.length+' gammes', tauxPrev>=90?C.success:tauxPrev>=70?C.warning:C.danger)}
      ${KPI(prevEnRetard, 'En retard', prevEnRetard?'À traiter':'Tout bon !', prevEnRetard?C.danger:C.success)}
    </div>

    ${topPieces.length > 0 ? `
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">📦 PIÈCES LES PLUS CONSOMMÉES</div>
      <div class="card">
        ${topPieces.map(({s, n}) => `
          <div class="ci">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.designation)}</div>
              <div style="font-size:11px;color:var(--muted)">${esc(s.reference||'')} · stock : ${s.quantite}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="color:${C.accent};font-weight:700;font-size:16px">${n}</div>
              <div style="font-size:10px;color:var(--muted)">consommée(s)</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">💰 VALEUR STOCK</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px">
      ${KPI(stockValue.toFixed(0)+'€', 'Valeur totale', S.stock.length+' références', C.accent)}
      ${KPI(stockAlt, 'Alertes stock', stockAlt?'Réappro nécessaire':'OK', stockAlt?C.warning:C.success)}
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">📄 RAPPORT PDF</div>
    <div class="card" style="padding:14px">
      <div style="font-size:13px;color:var(--text);margin-bottom:10px">Générer un rapport PDF complet du mois</div>
      <select class="sel" id="rpt-mois" style="margin-bottom:10px">
        ${(function(){
          const opts = [];
          for (let i = 0; i < 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const lbl = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            opts.push(`<option value="${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}">${lbl}</option>`);
          }
          return opts.join('');
        })()}
      </select>
      <button class="bp" onclick="generateMonthlyReport()" style="margin-top:0">📥 Télécharger le rapport PDF</button>
    </div>

    <div class="sp"></div>
  `;
}

// ═══════════════════════════════════
// RAPPORT PDF MENSUEL
// ═══════════════════════════════════
async function generateMonthlyReport() {
  const sel = document.getElementById('rpt-mois');
  if (!sel || !window.jspdf) { alert('Génération impossible'); return; }
  const [year, month] = sel.value.split('-').map(Number);
  const start = new Date(year, month - 1, 1);
  const end = new Date(year, month, 1);
  const monthLabel = start.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

  showToast('Génération du rapport…', '#58a6ff');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // Couleurs (en RGB pour jsPDF)
  const cAccent = [232, 151, 10];
  const cText = [33, 37, 41];
  const cMuted = [108, 117, 125];
  const cDanger = [220, 53, 69];
  const cSuccess = [40, 167, 69];

  // Header
  doc.setFillColor(...cAccent);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(20);
  doc.setFont('helvetica', 'bold');
  doc.text('RAPPORT DE MAINTENANCE', 14, 14);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.text(monthLabel.toUpperCase(), 14, 22);
  doc.setFontSize(8);
  doc.text(`Généré le ${new Date().toLocaleDateString('fr-FR')}`, 150, 22);

  // Filtrer OT du mois
  const otsMonth = S.ots.filter(o => {
    if (!o.dateCreation) return false;
    const d = new Date(o.dateCreation);
    return d >= start && d < end;
  });
  const correctifs = otsMonth.filter(o => o.type === 'correctif');
  const preventifs = otsMonth.filter(o => o.type === 'préventif');
  const termines = otsMonth.filter(o => o.statut === 'terminé');
  const enCours = otsMonth.filter(o => !['terminé','annulé'].includes(o.statut));
  const coutMOTotal = otsMonth.reduce((s,o) => s + (Number(o.coutMO)||0), 0);
  const coutPiecesTotal = otsMonth.reduce((s,o) => s + (Number(o.coutPieces)||0), 0);
  const coutTotal = coutMOTotal + coutPiecesTotal;
  const dureeTotal = termines.reduce((s,o) => s + (Number(o.dureeH)||0), 0);

  let y = 40;

  // Section : Synthèse
  doc.setTextColor(...cText);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text('Synthèse du mois', 14, y);
  y += 6;
  doc.setDrawColor(...cAccent);
  doc.setLineWidth(0.5);
  doc.line(14, y, 196, y);
  y += 8;

  // KPIs en grille
  const kpis = [
    [`${otsMonth.length}`, 'OT créés'],
    [`${termines.length}`, 'OT terminés'],
    [`${correctifs.length}`, 'Pannes (correctif)'],
    [`${preventifs.length}`, 'Préventifs réalisés'],
    [`${dureeTotal.toFixed(1)} h`, 'Temps total intervention'],
    [`${coutTotal.toFixed(2)} €`, 'Coût total mois'],
  ];
  doc.setFontSize(9);
  kpis.forEach((kpi, i) => {
    const col = i % 3;
    const row = Math.floor(i / 3);
    const x = 14 + col * 62;
    const yy = y + row * 22;
    doc.setFillColor(245, 245, 247);
    doc.roundedRect(x, yy, 58, 18, 2, 2, 'F');
    doc.setTextColor(...cAccent);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(kpi[0], x + 3, yy + 8);
    doc.setTextColor(...cMuted);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text(kpi[1], x + 3, yy + 14);
  });
  y += 50;

  // Détail coûts
  doc.setTextColor(...cText);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('Détail des coûts', 14, y);
  y += 6;
  doc.autoTable({
    startY: y,
    head: [['Catégorie', 'Montant']],
    body: [
      ['Main d\'œuvre', `${coutMOTotal.toFixed(2)} €`],
      ['Pièces consommées', `${coutPiecesTotal.toFixed(2)} €`],
      ['TOTAL', `${coutTotal.toFixed(2)} €`],
    ],
    theme: 'grid',
    headStyles: { fillColor: cAccent, textColor: 255, fontStyle: 'bold' },
    styles: { fontSize: 9 },
    margin: { left: 14, right: 14 },
  });
  y = doc.lastAutoTable.finalY + 10;

  // Liste OT du mois
  if (otsMonth.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(`Ordres de travail du mois (${otsMonth.length})`, 14, y);
    y += 2;
    doc.autoTable({
      startY: y + 4,
      head: [['N°', 'Titre', 'Machine', 'Type', 'Statut', 'Durée', 'Coût']],
      body: otsMonth.map(o => {
        const eq = S.eq.find(e => e.id === o.equipementId);
        return [
          o.numero || '—',
          (o.titre||'').slice(0, 35),
          (eq?.nom || '—').slice(0, 25),
          o.type || '',
          o.statut || '',
          (Number(o.dureeH)||0).toFixed(1) + 'h',
          (Number(o.coutTotal)||0).toFixed(2) + ' €',
        ];
      }),
      theme: 'striped',
      headStyles: { fillColor: cAccent, textColor: 255, fontStyle: 'bold' },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
      columnStyles: { 6: { halign: 'right' } },
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // Top machines problématiques
  const pannesCount = {};
  correctifs.forEach(o => {
    pannesCount[o.equipementId] = (pannesCount[o.equipementId]||0) + 1;
  });
  const topMachines = Object.entries(pannesCount)
    .map(([id, n]) => ({ eq: S.eq.find(e=>e.id===id), n }))
    .filter(x => x.eq)
    .sort((a,b) => b.n - a.n)
    .slice(0, 10);

  if (topMachines.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text('Machines les plus problématiques', 14, y);
    doc.autoTable({
      startY: y + 4,
      head: [['Rang', 'Machine', 'Localisation', 'Nb pannes']],
      body: topMachines.map((m, i) => [`#${i+1}`, m.eq.nom, m.eq.localisation || '—', m.n]),
      theme: 'striped',
      headStyles: { fillColor: cAccent, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // État du parc (au moment de la génération)
  if (y > 230) { doc.addPage(); y = 20; }
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('État actuel du parc', 14, y);
  const byStatut = {};
  S.eq.forEach(e => { byStatut[e.statut] = (byStatut[e.statut]||0) + 1; });
  doc.autoTable({
    startY: y + 4,
    head: [['Statut', 'Nombre', '%']],
    body: Object.entries(byStatut).map(([s,n]) => [s, n, ((n/S.eq.length)*100).toFixed(1)+' %']),
    theme: 'grid',
    headStyles: { fillColor: cAccent, textColor: 255 },
    styles: { fontSize: 9 },
    margin: { left: 14, right: 14 },
  });
  y = doc.lastAutoTable.finalY + 10;

  // Préventif en retard
  const prevRetard = S.prev.filter(p => { const d=daysUntil(p.prochaineEcheance); return d!==null && d<=0; });
  if (prevRetard.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...cDanger);
    doc.text(`⚠ Préventif en retard (${prevRetard.length})`, 14, y);
    doc.setTextColor(...cText);
    doc.autoTable({
      startY: y + 4,
      head: [['Tâche', 'Machine', 'Échéance', 'Retard']],
      body: prevRetard.map(p => {
        const eq = S.eq.find(e=>e.id===p.equipementId);
        const d = daysUntil(p.prochaineEcheance);
        return [p.tache, eq?.nom||'—', fmt(p.prochaineEcheance), `${Math.abs(d)} jour(s)`];
      }),
      theme: 'striped',
      headStyles: { fillColor: cDanger, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // Stock alertes
  const stockAlertes = S.stock.filter(s => s.quantite <= s.seuilAlerte);
  if (stockAlertes.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...cDanger);
    doc.text(`⚠ Stock en alerte (${stockAlertes.length})`, 14, y);
    doc.setTextColor(...cText);
    doc.autoTable({
      startY: y + 4,
      head: [['Référence', 'Désignation', 'Stock', 'Seuil', 'Fournisseur']],
      body: stockAlertes.map(s => [s.reference||'—', s.designation, s.quantite, s.seuilAlerte, s.fournisseur||'—']),
      theme: 'striped',
      headStyles: { fillColor: cDanger, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
    });
  }

  // Footer sur toutes les pages
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(...cMuted);
    doc.text(`GMAO · Rapport ${monthLabel}`, 14, 290);
    doc.text(`Page ${i}/${pageCount}`, 180, 290);
  }

  // Sauvegarder le PDF
  const filename = `Rapport_GMAO_${year}-${String(month).padStart(2,'0')}.pdf`;
  doc.save(filename);
  showToast('Rapport téléchargé !', '#3fb950');
}

async function saveTarif() {
  const v = document.getElementById('set-tarif').value;
  await setSetting('tarif_horaire', v);
  showToast('Tarif enregistré', C.success);
}

function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    equipements: S.eq,
    ots: S.ots,
    preventif: S.prev,
    stock: S.stock,
    otPieces: S.otPieces,
    settings: S.settings,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gmao-export-${today()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Export téléchargé', C.success);
}

// BANNER INSTALLATION
// ═══════════════════════════════════
function showInstallBanner() {
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (isStandalone || sessionStorage.getItem('banner-dismissed')) return;

  const banner = document.createElement('div');
  banner.id = 'install-tip';
  banner.innerHTML = `
    <span>📱</span>
    <span>Safari → <strong>Partager</strong> → <strong>Sur l'écran d'accueil</strong> pour installer l'app</span>
    <button onclick="this.parentElement.remove();sessionStorage.setItem('banner-dismissed','1')">×</button>`;
  document.getElementById('app').insertBefore(banner, document.getElementById('content'));
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════

// Indicateur de chargement
function showLoading() {
  document.getElementById('content').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px">
      <div style="width:36px;height:36px;border:3px solid #30363d;border-top-color:#e8970a;border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <div style="color:#8b949e;font-size:13px">Synchronisation cloud…</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  `;
}

// Affiche un toast court de statut connexion
let toastTimer;
function showToast(msg, color = '#3fb950') {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:9px 18px;border-radius:100px;font-size:12px;font-weight:600;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,0.4);opacity:0;transition:opacity .25s';
    document.body.appendChild(t);
  }
  t.innerHTML = `<span style="color:${color}">●</span> ${msg}`;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

// Détection online/offline
window.addEventListener('online', () => { S.online = true; showToast('Connecté · synchronisation…', '#3fb950'); initApp(); });
window.addEventListener('offline', () => { S.online = false; showToast('Hors ligne · mode local', '#d29922'); });

let initInProgress = false;
async function initApp() {
  if (initInProgress) return;
  initInProgress = true;
  renderNav();
  showLoading();
  try {
    if (cloudEnabled && navigator.onLine) {
      const data = await loadFromCloud();
      S.eq = data.eq; S.ots = data.ots; S.prev = data.prev; S.stock = data.stock;
      S.otPieces = data.otPieces || []; S.settings = data.settings || []; S.docs = data.docs || [];
      saveAll();
      S.loading = false;
      subscribeAll();
      showToast('Cloud connecté', '#3fb950');
    } else {
      S.eq = lsLoad('gmao-eq', []);
      S.ots = lsLoad('gmao-ot', []);
      S.prev = lsLoad('gmao-prev', []);
      S.stock = lsLoad('gmao-stock', []);
      S.otPieces = lsLoad('gmao-otPieces', []);
      S.settings = lsLoad('gmao-settings', [{id:'s-tarif',key:'tarif_horaire',value:'45'}]);
      S.docs = lsLoad('gmao-docs', []);
      S.loading = false;
      if (!cloudEnabled) showToast('Mode local (cloud indisponible)', '#d29922');
      else showToast('Hors ligne · mode local', '#d29922');
    }
  } catch (e) {
    console.error('Init:', e);
    S.eq = lsLoad('gmao-eq', []);
    S.ots = lsLoad('gmao-ot', []);
    S.prev = lsLoad('gmao-prev', []);
    S.stock = lsLoad('gmao-stock', []);
    S.otPieces = lsLoad('gmao-otPieces', []);
    S.settings = lsLoad('gmao-settings', [{id:'s-tarif',key:'tarif_horaire',value:'45'}]);
    S.docs = lsLoad('gmao-docs', []);
    S.loading = false;
    showToast('Erreur · cache local', '#f85149');
  }
  initInProgress = false;
  render();
}

initApp();
showInstallBanner();
</script>
