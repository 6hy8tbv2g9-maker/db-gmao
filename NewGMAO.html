// MODAL SYSTEM
// ═══════════════════════════════════
function openModal(html) {
  closeModal();
  const o=document.createElement('div');
  o.className='mo'; o.id='modal-o';
  o.innerHTML=`<div class="ms">${html}</div>`;
  o.addEventListener('click',e=>{ if(e.target===o){stopScanner();closeModal();} });
  document.body.appendChild(o);
}

function closeModal() {
  const el=document.getElementById('modal-o');
  if (el) { stopScanner(); el.remove(); }
}

// ═══════════════════════════════════
// STATISTIQUES
// ═══════════════════════════════════
function pgStats() {
  const period = Number(S.statsPeriod);
  const now = new Date();
  const cutoff = period > 0 ? new Date(now.getTime() - period*86400000) : new Date(0);

  const otsInPeriod = S.ots.filter(o => {
    if (!o.dateCreation) return false;
    return new Date(o.dateCreation) >= cutoff;
  });
  const otsTermines = otsInPeriod.filter(o => o.statut === 'terminé');
  const otsCorrectifs = otsInPeriod.filter(o => o.type === 'correctif');
  const otsPreventifs = otsInPeriod.filter(o => o.type === 'préventif');

  const dispo = S.eq.length === 0 ? 100 : Math.round((S.eq.filter(e => e.statut === 'en service').length / S.eq.length) * 100);
  const coutTotal = otsInPeriod.reduce((s, o) => s + (Number(o.coutTotal)||0), 0);
  const dureeTotal = otsTermines.reduce((s, o) => s + (Number(o.dureeH)||0), 0);
  const mttr = otsTermines.length > 0 ? (dureeTotal / otsTermines.length).toFixed(1) : 0;

  const pannesParMachine = {};
  otsCorrectifs.forEach(o => {
    if (!pannesParMachine[o.equipementId]) pannesParMachine[o.equipementId] = [];
    if (o.dateCreation) pannesParMachine[o.equipementId].push(new Date(o.dateCreation));
  });
  let totalGap = 0, gapCount = 0;
  Object.values(pannesParMachine).forEach(dates => {
    if (dates.length < 2) return;
    dates.sort((a,b)=>a-b);
    for (let i=1; i<dates.length; i++) {
      totalGap += (dates[i] - dates[i-1]) / 86400000;
      gapCount++;
    }
  });
  const mtbf = gapCount > 0 ? Math.round(totalGap / gapCount) : '—';

  const pannesCount = {};
  otsCorrectifs.forEach(o => {
    pannesCount[o.equipementId] = (pannesCount[o.equipementId]||0) + 1;
  });
  const topMachines = Object.entries(pannesCount)
    .map(([id, n]) => ({ eq: S.eq.find(e=>e.id===id), n }))
    .filter(x => x.eq)
    .sort((a,b) => b.n - a.n)
    .slice(0, 5);

  const moisLabels = [];
  const moisData = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const fin = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
    moisLabels.push(d.toLocaleDateString('fr-FR', { month: 'short' }));
    moisData.push(S.ots.filter(o => {
      if (!o.dateCreation) return false;
      const od = new Date(o.dateCreation);
      return od >= d && od < fin;
    }).length);
  }
  const maxMois = Math.max(...moisData, 1);

  const techCount = {};
  // Inclure tous les opérateurs connus, même sans OT sur la période
  operateurNoms().forEach(n => { techCount[n] = { total:0, termines:0, heures:0 }; });
  otsInPeriod.forEach(o => {
    const t = (o.technicien||'').trim() || '(non assigné)';
    if (!techCount[t]) techCount[t] = { total:0, termines:0, heures:0 };
    techCount[t].total++;
    if (o.statut === 'terminé') techCount[t].termines++;
    techCount[t].heures += Number(o.dureeH)||0;
  });
  const techRows = Object.entries(techCount).sort((a,b)=>b[1].total-a[1].total).slice(0,12);

  const prevEnRetard = S.prev.filter(p => { const d=daysUntil(p.prochaineEcheance); return d!==null && d<=0; }).length;
  const tauxPrev = S.prev.length === 0 ? 100 : Math.round(((S.prev.length - prevEnRetard) / S.prev.length) * 100);

  const piecesCount = {};
  S.otPieces.forEach(p => {
    if (!piecesCount[p.pieceId]) piecesCount[p.pieceId] = 0;
    piecesCount[p.pieceId] += Number(p.quantite)||0;
  });
  const topPieces = Object.entries(piecesCount)
    .map(([id, n]) => ({ s: S.stock.find(x=>x.id===id), n }))
    .filter(x => x.s)
    .sort((a,b)=>b.n-a.n)
    .slice(0, 5);

  const stockValue = S.stock.reduce((s, x) => s + x.quantite * (x.prixUnitaire||0), 0);
  const stockAlt = S.stock.filter(s => s.quantite <= s.seuilAlerte).length;

  const otsHorsPrev = otsInPeriod.filter(o => o.type !== 'préventif');
  const totalHP = otsHorsPrev.length || 1;
  const nbCorr = otsHorsPrev.filter(o=>o.type==='correctif').length;
  const nbAmel = otsHorsPrev.filter(o=>o.type==='amélioratif').length;
  const nbRonde = otsHorsPrev.filter(o=>o.type==='ronde').length;
  const pctCorr = Math.round((nbCorr/totalHP)*100);
  const pctAmel = Math.round((nbAmel/totalHP)*100);
  const pctRonde = Math.round((nbRonde/totalHP)*100);
  const pctAutre = Math.max(0, 100 - pctCorr - pctAmel - pctRonde);

  const KPI = (val, lbl, sub, col) => `
    <div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${col};border-radius:12px;padding:12px 14px">
      <div style="font-size:26px;font-weight:700;color:${col};line-height:1;font-family:Rajdhani,sans-serif">${val}</div>
      <div style="font-size:12px;font-weight:600;margin-top:5px">${lbl}</div>
      ${sub?`<div style="font-size:10px;color:var(--muted);margin-top:2px">${sub}</div>`:''}
    </div>`;

  return `
    <div class="ph">
      <div>
        <div class="pt">Statistiques</div>
        <div class="ps">${otsInPeriod.length} OT · ${S.eq.length} machine(s)</div>
      </div>
    </div>

    <div class="chips">
      ${[['7','7 jours'],['30','30 jours'],['90','3 mois'],['365','12 mois'],['0','Tout']].map(([v,l]) =>
        `<button class="chip ${S.statsPeriod===v?'on':''}" onclick="S.statsPeriod='${v}';render()">${l}</button>`
      ).join('')}
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:14px 14px 8px">VUE D'ENSEMBLE</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px">
      ${KPI(dispo+'%', 'Disponibilité parc', S.eq.filter(e=>e.statut==='en panne').length+' en panne', dispo>=90?C.success:dispo>=75?C.warning:C.danger)}
      ${KPI(coutTotal.toFixed(0)+'€', 'Coût total période', 'MO + pièces', C.accent)}
      ${KPI(mttr+'h', 'MTTR moyen', 'Durée moy. réparation', C.info)}
      ${KPI(mtbf==='—'?'—':mtbf+'j', 'MTBF moyen', 'Entre pannes', C.success)}
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">RÉPARTITION DES OT (hors préventif)</div>
    <div class="card" style="padding:14px">
      <div style="display:flex;height:24px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--bg)">
        <div style="background:${C.danger};width:${pctCorr}%"></div>
        <div style="background:${C.info};width:${pctAmel}%"></div>
        <div style="background:${C.accent};width:${pctRonde}%"></div>
        <div style="background:${C.muted};width:${pctAutre}%"></div>
      </div>
      <div style="display:flex;gap:14px;font-size:11px;flex-wrap:wrap">
        <span><span style="color:${C.danger}">●</span> Correctif ${pctCorr}% (${nbCorr})</span>
        <span><span style="color:${C.info}">●</span> Amélioratif ${pctAmel}% (${nbAmel})</span>
        <span><span style="color:${C.accent}">●</span> Ronde ${pctRonde}% (${nbRonde})</span>
      </div>
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">OT PAR MOIS (12 derniers)</div>
    <div class="card" style="padding:14px">
      <div style="display:flex;align-items:flex-end;gap:4px;height:120px">
        ${moisData.map((v,i) => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
            <div style="font-size:9px;color:var(--muted);height:11px">${v||''}</div>
            <div style="width:100%;background:${v>0?C.accent:'var(--border)'};height:${(v/maxMois)*90}px;min-height:2px;border-radius:3px 3px 0 0"></div>
            <div style="font-size:9px;color:var(--muted)">${moisLabels[i]}</div>
          </div>
        `).join('')}
      </div>
    </div>

    ${topMachines.length > 0 ? `
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">⚠ TOP MACHINES PROBLÉMATIQUES</div>
      <div class="card">
        ${topMachines.map(({eq, n}, i) => `
          <div class="ci" onclick="modalEq('${eq.id}')" style="border-bottom:1px solid var(--border)22">
            <div style="width:28px;height:28px;background:${i===0?C.danger:i===1?'#ff9580':C.warning}33;color:${i===0?C.danger:i===1?'#ff9580':C.warning};border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">${i+1}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(eq.nom)}</div>
              <div style="font-size:11px;color:var(--muted)">📍 ${esc(eq.localisation)}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="color:${C.danger};font-weight:700;font-size:16px">${n}</div>
              <div style="font-size:10px;color:var(--muted)">panne(s)</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    ${techRows.length > 0 ? `
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">👷 CHARGE PAR TECHNICIEN</div>
      <div class="card">
        ${techRows.map(([t, d]) => `
          <div style="padding:11px 14px;border-bottom:1px solid var(--border)22">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
              <div style="font-size:13px;font-weight:600">${esc(t)}</div>
              <div style="font-size:12px;color:var(--muted)">${d.total} OT · ${d.heures.toFixed(1)}h</div>
            </div>
            <div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden">
              <div style="height:100%;background:${C.success};width:${d.total>0?(d.termines/d.total)*100:0}%"></div>
            </div>
            <div style="font-size:10px;color:var(--muted);margin-top:3px">${d.termines}/${d.total} terminés</div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">📅 PRÉVENTIF</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px">
      ${KPI(tauxPrev+'%', 'Taux à temps', S.prev.length+' gammes', tauxPrev>=90?C.success:tauxPrev>=70?C.warning:C.danger)}
      ${KPI(prevEnRetard, 'En retard', prevEnRetard?'À traiter':'Tout bon !', prevEnRetard?C.danger:C.success)}
    </div>

    ${topPieces.length > 0 ? `
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">📦 PIÈCES LES PLUS CONSOMMÉES</div>
      <div class="card">
        ${topPieces.map(({s, n}) => `
          <div class="ci">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.designation)}</div>
              <div style="font-size:11px;color:var(--muted)">${esc(s.reference||'')} · stock : ${s.quantite}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="color:${C.accent};font-weight:700;font-size:16px">${n}</div>
              <div style="font-size:10px;color:var(--muted)">consommée(s)</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">💰 VALEUR STOCK</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px">
      ${KPI(stockValue.toFixed(0)+'€', 'Valeur totale', S.stock.length+' références', C.accent)}
      ${KPI(stockAlt, 'Alertes stock', stockAlt?'Réappro nécessaire':'OK', stockAlt?C.warning:C.success)}
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">📄 RAPPORT PDF</div>
    <div class="card" style="padding:14px">
      <div style="font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600">Rapport mensuel</div>
      <select class="sel" id="rpt-mois" style="margin-bottom:10px">
        ${(function(){
          const opts = [];
          for (let i = 0; i < 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const lbl = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            opts.push(`<option value="${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}">${lbl}</option>`);
          }
          return opts.join('');
        })()}
      </select>
      <button class="bp" onclick="generateMonthlyReport()" style="margin-top:0;margin-bottom:14px">📥 Télécharger rapport mensuel</button>

      <div style="font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600;margin-top:10px">Rapport journalier</div>
      <input class="inp" type="date" id="rpt-jour" value="${today()}" style="margin-bottom:10px"/>
      <button class="bp" onclick="generateDailyReport()" style="margin-top:0;margin-bottom:14px">📥 Télécharger rapport du jour</button>

      <div style="font-size:13px;color:var(--text);margin-bottom:10px;font-weight:600;margin-top:10px">État du stock</div>
      <button class="bp" onclick="generateStockReport(false)" style="margin-top:0;margin-bottom:8px">📦 PDF stock complet</button>
      <button class="bp" onclick="generateStockReport(true)" style="margin-top:0;background:rgba(217,151,10,.15);border:1px solid rgba(217,151,10,.4);color:${C.warning}">⚠ PDF alertes stock</button>
    </div>

    <div class="sp"></div>
  `;
}

// ═══════════════════════════════════
// RAPPORT PDF MENSUEL
// ═══════════════════════════════════
async function generateMonthlyReport() {
  const sel = document.getElementById('rpt-mois');
  if (!sel || !window.jspdf) { alert('Génération impossible'); return; }
  const [year, month] = sel.value.split('-').map(Number);
  const start = new Date(year, month - 1, 1);
  const end = new Date(year, month, 1);
  const monthLabel = start.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

  showToast('Génération du rapport…', '#58a6ff');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // Couleurs (en RGB pour jsPDF)
  const cAccent = [232, 151, 10];
  const cText = [33, 37, 41];
  const cMuted = [108, 117, 125];
  const cDanger = [220, 53, 69];
  const cSuccess = [40, 167, 69];

  // Header
  doc.setFillColor(...cAccent);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(20);
  doc.setFont('helvetica', 'bold');
  doc.text('RAPPORT DE MAINTENANCE', 14, 14);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.text(monthLabel.toUpperCase(), 14, 22);
  doc.setFontSize(8);
  doc.text(`Généré le ${new Date().toLocaleDateString('fr-FR')}`, 150, 22);

  // Filtrer OT du mois
  const otsMonth = S.ots.filter(o => {
    if (!o.dateCreation) return false;
    const d = new Date(o.dateCreation);
    return d >= start && d < end;
  });
  const correctifs = otsMonth.filter(o => o.type === 'correctif');
  const preventifs = otsMonth.filter(o => o.type === 'préventif');
  const termines = otsMonth.filter(o => o.statut === 'terminé');
  const enCours = otsMonth.filter(o => !['terminé','annulé'].includes(o.statut));
  const coutMOTotal = otsMonth.reduce((s,o) => s + (Number(o.coutMO)||0), 0);
  const coutPiecesTotal = otsMonth.reduce((s,o) => s + (Number(o.coutPieces)||0), 0);
  const coutTotal = coutMOTotal + coutPiecesTotal;
  const dureeTotal = termines.reduce((s,o) => s + (Number(o.dureeH)||0), 0);

  let y = 40;

  // Section : Synthèse
  doc.setTextColor(...cText);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text('Synthèse du mois', 14, y);
  y += 6;
  doc.setDrawColor(...cAccent);
  doc.setLineWidth(0.5);
  doc.line(14, y, 196, y);
  y += 8;

  // KPIs en grille
  const kpis = [
    [`${otsMonth.length}`, 'OT créés'],
    [`${termines.length}`, 'OT terminés'],
    [`${correctifs.length}`, 'Pannes (correctif)'],
    [`${preventifs.length}`, 'Préventifs réalisés'],
    [`${dureeTotal.toFixed(1)} h`, 'Temps total intervention'],
    [`${coutTotal.toFixed(2)} €`, 'Coût total mois'],
  ];
  doc.setFontSize(9);
  kpis.forEach((kpi, i) => {
    const col = i % 3;
    const row = Math.floor(i / 3);
    const x = 14 + col * 62;
    const yy = y + row * 22;
    doc.setFillColor(245, 245, 247);
    doc.roundedRect(x, yy, 58, 18, 2, 2, 'F');
    doc.setTextColor(...cAccent);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(kpi[0], x + 3, yy + 8);
    doc.setTextColor(...cMuted);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text(kpi[1], x + 3, yy + 14);
  });
  y += 50;

  // Détail coûts
  doc.setTextColor(...cText);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('Détail des coûts', 14, y);
  y += 6;
  doc.autoTable({
    startY: y,
    head: [['Catégorie', 'Montant']],
    body: [
      ['Main d\'œuvre', `${coutMOTotal.toFixed(2)} €`],
      ['Pièces consommées', `${coutPiecesTotal.toFixed(2)} €`],
      ['TOTAL', `${coutTotal.toFixed(2)} €`],
    ],
    theme: 'grid',
    headStyles: { fillColor: cAccent, textColor: 255, fontStyle: 'bold' },
    styles: { fontSize: 9 },
    margin: { left: 14, right: 14 },
  });
  y = doc.lastAutoTable.finalY + 10;

  // Liste OT du mois
  if (otsMonth.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(`Ordres de travail du mois (${otsMonth.length})`, 14, y);
    y += 2;
    doc.autoTable({
      startY: y + 4,
      head: [['N°', 'Titre', 'Machine', 'Type', 'Statut', 'Durée', 'Coût']],
      body: otsMonth.map(o => {
        const eq = S.eq.find(e => e.id === o.equipementId);
        return [
          o.numero || '—',
          (o.titre||'').slice(0, 35),
          (eq?.nom || '—').slice(0, 25),
          o.type || '',
          o.statut || '',
          (Number(o.dureeH)||0).toFixed(1) + 'h',
          (Number(o.coutTotal)||0).toFixed(2) + ' €',
        ];
      }),
      theme: 'striped',
      headStyles: { fillColor: cAccent, textColor: 255, fontStyle: 'bold' },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
      columnStyles: { 6: { halign: 'right' } },
    });
    y = doc.lastAutoTable.finalY + 10;

    // Observations détaillées (OT qui en ont)
    const otsAvecObs = otsMonth.filter(o => (o.observations||'').trim());
    if (otsAvecObs.length > 0) {
      if (y > 250) { doc.addPage(); y = 20; }
      doc.setTextColor(...cText);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text('Observations / comptes-rendus', 14, y);
      y += 8;
      otsAvecObs.forEach(o => {
        const obsLines = doc.splitTextToSize(o.observations.trim(), 175);
        const blocH = 8 + obsLines.length * 4.5 + 4;
        if (y + blocH > 285) { doc.addPage(); y = 20; }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9);
        doc.setTextColor(...cAccent);
        doc.text(`${o.numero || '—'} · ${(o.titre||'').slice(0,60)}`, 14, y);
        y += 5;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(...cText);
        doc.text(obsLines, 16, y);
        y += obsLines.length * 4.5 + 5;
      });
      y += 4;
    }
  }

  // Top machines problématiques
  const pannesCount = {};
  correctifs.forEach(o => {
    pannesCount[o.equipementId] = (pannesCount[o.equipementId]||0) + 1;
  });
  const topMachines = Object.entries(pannesCount)
    .map(([id, n]) => ({ eq: S.eq.find(e=>e.id===id), n }))
    .filter(x => x.eq)
    .sort((a,b) => b.n - a.n)
    .slice(0, 10);

  if (topMachines.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text('Machines les plus problématiques', 14, y);
    doc.autoTable({
      startY: y + 4,
      head: [['Rang', 'Machine', 'Localisation', 'Nb pannes']],
      body: topMachines.map((m, i) => [`#${i+1}`, m.eq.nom, m.eq.localisation || '—', m.n]),
      theme: 'striped',
      headStyles: { fillColor: cAccent, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // État du parc (au moment de la génération)
  if (y > 230) { doc.addPage(); y = 20; }
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('État actuel du parc', 14, y);
  const byStatut = {};
  S.eq.forEach(e => { byStatut[e.statut] = (byStatut[e.statut]||0) + 1; });
  doc.autoTable({
    startY: y + 4,
    head: [['Statut', 'Nombre', '%']],
    body: Object.entries(byStatut).map(([s,n]) => [s, n, ((n/S.eq.length)*100).toFixed(1)+' %']),
    theme: 'grid',
    headStyles: { fillColor: cAccent, textColor: 255 },
    styles: { fontSize: 9 },
    margin: { left: 14, right: 14 },
  });
  y = doc.lastAutoTable.finalY + 10;

  // Préventif en retard
  const prevRetard = S.prev.filter(p => { const d=daysUntil(p.prochaineEcheance); return d!==null && d<=0; });
  if (prevRetard.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...cDanger);
    doc.text(`⚠ Préventif en retard (${prevRetard.length})`, 14, y);
    doc.setTextColor(...cText);
    doc.autoTable({
      startY: y + 4,
      head: [['Tâche', 'Machine', 'Échéance', 'Retard']],
      body: prevRetard.map(p => {
        const eq = S.eq.find(e=>e.id===p.equipementId);
        const d = daysUntil(p.prochaineEcheance);
        return [p.tache, eq?.nom||'—', fmt(p.prochaineEcheance), `${Math.abs(d)} jour(s)`];
      }),
      theme: 'striped',
      headStyles: { fillColor: cDanger, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // Stock alertes
  const stockAlertes = S.stock.filter(s => s.quantite <= s.seuilAlerte);
  if (stockAlertes.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...cDanger);
    doc.text(`⚠ Stock en alerte (${stockAlertes.length})`, 14, y);
    doc.setTextColor(...cText);
    doc.autoTable({
      startY: y + 4,
      head: [['Référence', 'Désignation', 'Stock', 'Seuil', 'Fournisseur']],
      body: stockAlertes.map(s => [s.reference||'—', s.designation, s.quantite, s.seuilAlerte, s.fournisseur||'—']),
      theme: 'striped',
      headStyles: { fillColor: cDanger, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
    });
  }

  // Footer sur toutes les pages
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(...cMuted);
    doc.text(`GMAO · Rapport ${monthLabel}`, 14, 290);
    doc.text(`Page ${i}/${pageCount}`, 180, 290);
  }

  // Sauvegarder le PDF
  const filename = `Rapport_GMAO_${year}-${String(month).padStart(2,'0')}.pdf`;
  doc.save(filename);
  showToast('Rapport téléchargé !', '#3fb950');
}

// ═══════════════════════════════════
// RAPPORT PDF JOURNALIER
// ═══════════════════════════════════
async function generateDailyReport() {
  const sel = document.getElementById('rpt-jour');
  if (!sel || !window.jspdf) { alert('Génération impossible'); return; }
  const dateStr = sel.value;
  if (!dateStr) { alert('Sélectionnez un jour'); return; }
  const day = new Date(dateStr);
  const dayLabel = day.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  showToast('Génération du rapport…', '#58a6ff');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cAccent = [232, 151, 10];
  const cText = [33, 37, 41];
  const cMuted = [108, 117, 125];
  const cDanger = [220, 53, 69];

  // Header
  doc.setFillColor(...cAccent);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text('RAPPORT JOURNALIER', 14, 14);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.text(dayLabel.toUpperCase(), 14, 22);
  doc.setFontSize(8);
  doc.text(`Généré le ${new Date().toLocaleDateString('fr-FR')}`, 150, 22);

  // OT du jour (date_creation ou date_fin ou date_debut)
  const dayStart = new Date(day); dayStart.setHours(0,0,0,0);
  const dayEnd = new Date(day); dayEnd.setHours(23,59,59,999);
  const isThisDay = (d) => {
    if (!d) return false;
    const dt = new Date(d);
    return dt >= dayStart && dt <= dayEnd;
  };
  const otsCrees = S.ots.filter(o => isThisDay(o.dateCreation));
  const otsTermines = S.ots.filter(o => isThisDay(o.dateFin) || isThisDay(o.dateCloture));
  const otsToday = [...new Set([...otsCrees, ...otsTermines])];
  const coutMOJour = otsTermines.reduce((s,o) => s + (Number(o.coutMO)||0), 0);
  const coutPiecesJour = otsTermines.reduce((s,o) => s + (Number(o.coutPieces)||0), 0);
  const dureeTotalJour = otsTermines.reduce((s,o) => s + (Number(o.dureeH)||0), 0);

  // Préventifs prévus aujourd'hui
  const prevDuJour = S.prev.filter(p => p.prochaineEcheance === dateStr);

  let y = 40;

  doc.setTextColor(...cText);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text('Synthèse de la journée', 14, y);
  y += 6;
  doc.setDrawColor(...cAccent);
  doc.setLineWidth(0.5);
  doc.line(14, y, 196, y);
  y += 8;

  const kpis = [
    [`${otsCrees.length}`, 'OT créés'],
    [`${otsTermines.length}`, 'OT terminés'],
    [`${dureeTotalJour.toFixed(1)} h`, 'Temps intervention'],
    [`${(coutMOJour + coutPiecesJour).toFixed(2)} €`, 'Coût du jour'],
    [`${prevDuJour.length}`, 'Préventifs prévus'],
  ];
  doc.setFontSize(9);
  kpis.forEach((kpi, i) => {
    const col = i % 3;
    const row = Math.floor(i / 3);
    const x = 14 + col * 62;
    const yy = y + row * 22;
    doc.setFillColor(245, 245, 247);
    doc.roundedRect(x, yy, 58, 18, 2, 2, 'F');
    doc.setTextColor(...cAccent);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(kpi[0], x + 3, yy + 8);
    doc.setTextColor(...cMuted);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text(kpi[1], x + 3, yy + 14);
  });
  y += (Math.ceil(kpis.length / 3)) * 22 + 8;

  // OT du jour
  if (otsToday.length > 0) {
    doc.setTextColor(...cText);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(`Ordres de travail (${otsToday.length})`, 14, y);
    doc.autoTable({
      startY: y + 4,
      head: [['N°', 'Titre', 'Machine', 'Type', 'Statut', 'Durée', 'Coût']],
      body: otsToday.map(o => {
        const eq = S.eq.find(e => e.id === o.equipementId);
        return [
          o.numero || '—',
          (o.titre||'').slice(0, 30),
          (eq?.nom || '—').slice(0, 22),
          o.type || '',
          o.statut || '',
          (Number(o.dureeH)||0).toFixed(1) + 'h',
          (Number(o.coutTotal)||0).toFixed(2) + ' €',
        ];
      }),
      theme: 'striped',
      headStyles: { fillColor: cAccent, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
      columnStyles: { 6: { halign: 'right' } },
    });
    y = doc.lastAutoTable.finalY + 10;

    // Observations détaillées (OT qui en ont)
    const otsAvecObs = otsToday.filter(o => (o.observations||'').trim());
    if (otsAvecObs.length > 0) {
      if (y > 250) { doc.addPage(); y = 20; }
      doc.setTextColor(...cText);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text('Observations / comptes-rendus', 14, y);
      y += 8;
      otsAvecObs.forEach(o => {
        const obsLines = doc.splitTextToSize(o.observations.trim(), 175);
        const blocH = 8 + obsLines.length * 4.5 + 4;
        if (y + blocH > 285) { doc.addPage(); y = 20; }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9);
        doc.setTextColor(...cAccent);
        doc.text(`${o.numero || '—'} · ${(o.titre||'').slice(0,60)}`, 14, y);
        y += 5;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(...cText);
        doc.text(obsLines, 16, y);
        y += obsLines.length * 4.5 + 5;
      });
      y += 4;
    }
  } else {
    doc.setFontSize(11);
    doc.setFont('helvetica', 'italic');
    doc.setTextColor(...cMuted);
    doc.text('Aucun OT ce jour.', 14, y);
    y += 10;
  }

  // Préventifs du jour
  if (prevDuJour.length > 0) {
    if (y > 250) { doc.addPage(); y = 20; }
    doc.setTextColor(...cText);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(`Préventifs prévus (${prevDuJour.length})`, 14, y);
    doc.autoTable({
      startY: y + 4,
      head: [['Tâche', 'Machine', 'Fréquence', 'Technicien']],
      body: prevDuJour.map(p => {
        const eq = S.eq.find(e => e.id === p.equipementId);
        return [(p.tache||'').slice(0,40), eq?.nom||'—', p.frequence||'', p.technicien||'—'];
      }),
      theme: 'striped',
      headStyles: { fillColor: cAccent, textColor: 255 },
      styles: { fontSize: 8 },
      margin: { left: 14, right: 14 },
    });
  }

  // Footer
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(...cMuted);
    doc.text(`GMAO · Rapport du ${dayLabel}`, 14, 290);
    doc.text(`Page ${i}/${pageCount}`, 180, 290);
  }

  const filename = `Rapport_GMAO_${dateStr}.pdf`;
  doc.save(filename);
  showToast('Rapport téléchargé !', '#3fb950');
}

// ═══════════════════════════════════
// RAPPORT PDF STOCK
// ═══════════════════════════════════
async function generateStockReport(alertesOnly) {
  if (!window.jspdf) { alert('Génération impossible'); return; }
  showToast('Génération du rapport…', '#58a6ff');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cAccent = [232, 151, 10];
  const cText = [33, 37, 41];
  const cMuted = [108, 117, 125];
  const cDanger = [220, 53, 69];
  const cWarning = [217, 151, 10];

  // Filtrer + trier par désignation A→Z
  let list = [...S.stock];
  if (alertesOnly) list = list.filter(s => s.quantite <= s.seuilAlerte);
  list.sort((a,b) => (a.designation||'').localeCompare(b.designation||'', 'fr'));

  const titre = alertesOnly ? 'STOCK — ALERTES' : 'ÉTAT DU STOCK';
  const valeurTotale = list.reduce((s,x) => s + (Number(x.quantite)||0) * (Number(x.prixUnitaire)||0), 0);

  // Header
  doc.setFillColor(...cAccent);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text(titre, 14, 14);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text(`${list.length} référence(s) · Valeur: ${valeurTotale.toFixed(2)} €`, 14, 22);
  doc.setFontSize(8);
  doc.text(`Généré le ${new Date().toLocaleDateString('fr-FR')}`, 150, 22);

  let y = 40;

  if (list.length === 0) {
    doc.setTextColor(...cMuted);
    doc.setFontSize(12);
    doc.setFont('helvetica', 'italic');
    doc.text(alertesOnly ? 'Aucune pièce en alerte. Stock OK !' : 'Aucune pièce en stock.', 14, y);
  } else {
    doc.autoTable({
      startY: y,
      head: [['Désignation', 'Référence', 'Catégorie', 'Stock', 'Seuil', 'Emplacement', 'Fournisseur', 'PU €']],
      body: list.map(s => {
        const alerte = s.quantite <= s.seuilAlerte;
        return [
          (s.designation||'').slice(0, 30),
          s.reference || '—',
          (s.categorie || '—').slice(0, 15),
          { content: String(s.quantite), styles: alerte ? { textColor: cDanger, fontStyle: 'bold' } : {} },
          String(s.seuilAlerte),
          (s.localisation || '—').slice(0, 15),
          (s.fournisseur || '—').slice(0, 15),
          (Number(s.prixUnitaire)||0).toFixed(2),
        ];
      }),
      theme: 'striped',
      headStyles: { fillColor: cAccent, textColor: 255, fontStyle: 'bold' },
      styles: { fontSize: 7.5 },
      margin: { left: 10, right: 10 },
      columnStyles: { 3: { halign: 'center' }, 4: { halign: 'center' }, 7: { halign: 'right' } },
    });
    y = doc.lastAutoTable.finalY + 10;

    // Résumé alertes (si rapport complet)
    if (!alertesOnly) {
      const alertes = list.filter(s => s.quantite <= s.seuilAlerte);
      if (alertes.length > 0) {
        if (y > 250) { doc.addPage(); y = 20; }
        doc.setTextColor(...cDanger);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text(`⚠ ${alertes.length} pièce(s) à réapprovisionner`, 14, y);
      }
    }
  }

  // Footer
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(...cMuted);
    doc.text(`GMAO · ${titre}`, 14, 290);
    doc.text(`Page ${i}/${pageCount}`, 180, 290);
  }

  const filename = alertesOnly ? `Stock_Alertes_${today()}.pdf` : `Stock_Complet_${today()}.pdf`;
  doc.save(filename);
  showToast('Rapport téléchargé !', '#3fb950');
}

    ` : ''}

    ${canManage() ? `
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">🗓 INDISPONIBILITÉS DE L'ÉQUIPE</div>
    <div class="card">
      ${(()=>{
        const autres = S.indispoPerso.filter(i=>i.user_id!==currentUser.id);
        if (autres.length===0) return `<div style="padding:14px;font-size:12px;color:var(--muted);text-align:center;font-style:italic">Aucune indisponibilité déclarée par l'équipe</div>`;

          ${list.map(i=>`
            <div style="padding:12px 14px;border-bottom:1px solid var(--border)22;display:flex;justify-content:space-between;align-items:center;gap:10px">

              <button onclick="delMyIndispo('${i.id}')" style="background:transparent;border:1px solid ${C.danger}44;color:${C.danger};font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer">✕</button>

    <div class="card" style="padding:14px">
      <button class="bs" onclick="showAideMemoire()" style="width:100%;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);color:${C.info};padding:12px">📋 Aide-mémoire ${currentRole}</button>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">🎨 APPARENCE</div>
    <div class="card" style="padding:14px">
      <div style="display:flex;gap:8px">
        <button class="bs" onclick="setTheme('dark')" style="flex:1;padding:12px;${getTheme()!=='light'?`background:rgba(232,151,10,.15);border:1px solid rgba(232,151,10,.45);color:${C.accent};font-weight:700`:''}">🌙 Sombre</button>

      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">Le choix est mémorisé sur cet appareil.</div>
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">🔒 COMPTE</div>
    <div class="card">
      <div style="padding:14px;border-bottom:1px solid var(--border)22">
        <div style="font-size:13px;font-weight:600">Connecté</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${currentUser ? esc(currentUser.email) : 'Mode local'}</div>
        <div style="margin-top:6px"><span style="display:inline-block;background:rgba(232,151,10,.15);border:1px solid rgba(232,151,10,.4);color:${C.accent};font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em">${currentRole}</span></div>
      </div>
      <div style="padding:14px;border-bottom:1px solid var(--border)22">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:13px;font-weight:600">🔐 Code PIN (verrouillage auto)</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${hasPin() ? 'Activé · verrouillage après 5 min d\'inactivité' : 'Désactivé'}</div>
          </div>

        </div>
        <div style="margin-top:10px;display:flex;gap:8px">
          ${hasPin()
            ? `<button class="bs" onclick="changePinModal()" style="flex:1">Modifier</button><button class="bs" onclick="disablePinModal()" style="flex:1;color:${C.danger}">Désactiver</button>`

            <div style="font-size:11px;color:var(--muted);margin-top:2px">${pushOn ? 'Activées · alerte à chaque nouvel OT' : 'Recevoir une alerte à chaque nouvel OT créé'}</div>

      </div>
      ${currentUser ? `<div style="padding:14px;display:flex;flex-direction:column;gap:8px">
        <button class="bs" onclick="changePasswordModal()" style="width:100%">🔑 Changer mon mot de passe</button>
        <button class="bs" onclick="doLogout()" style="width:100%;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35);color:#f85149">🚪 Se déconnecter</button>
      </div>` : ''}
    </div>

    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:18px 14px 8px">ℹ️ À PROPOS</div>
    <div class="card" style="padding:14px;font-size:12px;color:var(--muted);line-height:1.6">
      <div>GMAO PWA v2.0</div>
      <div>Synchronisation cloud via Supabase</div>
      <div style="margin-top:8px">Pour installer sur un autre appareil :</div>
      <div style="font-family:monospace;font-size:11px;color:var(--accent);margin-top:5px;word-break:break-all">6hy8tbv2g9-maker.github.io/db-gmao/NewGMAO.html</div>
    </div>

    <div class="sp"></div>
  `;
}

async function saveTarif() {
  const v = document.getElementById('set-tarif').value;
  await setSetting('tarif_horaire', v);
  showToast('Tarif enregistré', C.success);
}

function addIndispModal() {
  openModal(`
    <div class="mh"></div>
    <div class="mhd"><span class="mt">Nouvelle indisponibilité</span><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="g2">
        <div class="fi"><label class="fl">Date début</label><input class="inp" type="date" id="ind-deb" value="${today()}"/></div>
        <div class="fi"><label class="fl">Date fin</label><input class="inp" type="date" id="ind-fin" value="${today()}"/></div>
      </div>
      <div class="fi"><label class="fl">Motif (optionnel)</label><input class="inp" id="ind-motif" placeholder="Vacances, formation…"/></div>
      <button class="bp" onclick="saveIndisp()">Enregistrer</button>
    </div>
  `);
}

function saveIndisp() {
  const dateDebut = document.getElementById('ind-deb').value;
  const dateFin = document.getElementById('ind-fin').value;
  const motif = document.getElementById('ind-motif').value;
  if (!dateDebut || !dateFin) { alert('Dates obligatoires'); return; }
  if (new Date(dateFin) < new Date(dateDebut)) { alert('La date de fin doit être après la date de début'); return; }
  const row = { id: uid(), dateDebut, dateFin, motif };
  S.indisp = [...S.indisp, row];
  syncSave('indisp', row);
  closeModal();
  render();
  showToast('Indisponibilité ajoutée', C.success);
}

function delIndisp(id) {
  if (!confirm('Supprimer cette indisponibilité ?')) return;
  S.indisp = S.indisp.filter(i => i.id !== id);
  syncDelete('indisp', id);
  render();
}

function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    equipements: S.eq,
    ots: S.ots,
    preventif: S.prev,
    stock: S.stock,
    otPieces: S.otPieces,
    settings: S.settings,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gmao-export-${today()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Export téléchargé', C.success);
}

// ═══════════════════════════════════
// BANNER INSTALLATION
// ═══════════════════════════════════
function showInstallBanner() {
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (isStandalone || sessionStorage.getItem('banner-dismissed')) return;

  const banner = document.createElement('div');
  banner.id = 'install-tip';
  banner.innerHTML = `
    <span>📱</span>
    <span>Safari → <strong>Partager</strong> → <strong>Sur l'écran d'accueil</strong> pour installer l'app</span>
    <button onclick="this.parentElement.remove();sessionStorage.setItem('banner-dismissed','1')">×</button>`;
  document.getElementById('app').insertBefore(banner, document.getElementById('content'));
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════

// Indicateur de chargement
function showLoading() {
  document.getElementById('content').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px">
      <div style="width:36px;height:36px;border:3px solid #30363d;border-top-color:#e8970a;border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <div style="color:#8b949e;font-size:13px">Synchronisation cloud…</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  `;
}

// Affiche un toast court de statut connexion
let toastTimer;
function showToast(msg, color = '#3fb950') {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:9px 18px;border-radius:100px;font-size:12px;font-weight:600;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,0.4);opacity:0;transition:opacity .25s';
    document.body.appendChild(t);
  }
  t.innerHTML = `<span style="color:${color}">●</span> ${msg}`;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

// Détection online/offline
window.addEventListener('online', () => { S.online = true; showToast('Connecté · synchronisation…', '#3fb950'); initApp(); });
window.addEventListener('offline', () => { S.online = false; showToast('Hors ligne · mode local', '#d29922'); });

let initInProgress = false;
async function initApp() {
  if (initInProgress) return;
  initInProgress = true;
  renderNav();
  showLoading();
  try {
    if (cloudEnabled && navigator.onLine) {
      const data = await loadFromCloud();
      S.eq = data.eq; S.ots = data.ots; S.prev = data.prev; S.stock = data.stock;
      S.otPieces = data.otPieces || []; S.settings = data.settings || []; S.docs = data.docs || []; S.indisp = data.indisp || [];
      await loadOperateurs();
      await loadIndispoPerso();
      saveAll();
      S.loading = false;
      subscribeAll();
      showToast('Cloud connecté', '#3fb950');
    } else {
      S.eq = lsLoad('gmao-eq', []);
      S.ots = lsLoad('gmao-ot', []);
      S.prev = lsLoad('gmao-prev', []);
      S.stock = lsLoad('gmao-stock', []);
      S.otPieces = lsLoad('gmao-otPieces', []);
      S.settings = lsLoad('gmao-settings', [{id:'s-tarif',key:'tarif_horaire',value:'45'}]);
      S.docs = lsLoad('gmao-docs', []);
      S.loading = false;
      if (!cloudEnabled) showToast('Mode local (cloud indisponible)', '#d29922');
      else showToast('Hors ligne · mode local', '#d29922');
    }
  } catch (e) {
    console.error('Init:', e);
    // Si erreur d'authentification, rediriger vers login
    if (cloudEnabled && e && (e.message||'').toLowerCase().includes('jwt')) {
      currentUser = null;
      showLogin('Session expirée, reconnectez-vous');
      initInProgress = false;
      return;
    }
    S.eq = lsLoad('gmao-eq', []);
    S.ots = lsLoad('gmao-ot', []);
    S.prev = lsLoad('gmao-prev', []);
    S.stock = lsLoad('gmao-stock', []);
    S.otPieces = lsLoad('gmao-otPieces', []);
    S.settings = lsLoad('gmao-settings', [{id:'s-tarif',key:'tarif_horaire',value:'45'}]);
    S.docs = lsLoad('gmao-docs', []);
    S.loading = false;
    showToast('Erreur · cache local', '#f85149');
  }
  initInProgress = false;
  render();
}

// Démarrage : vérifier l'authentification avant tout
async function bootApp() {
  registerServiceWorker();
  if (cloudEnabled) {
    // Détecter si on arrive depuis un lien de réinitialisation de mot de passe
    const isRecovery = await checkPasswordRecovery();
    if (isRecovery) return;
    const isAuth = await checkAuth();
    if (!isAuth) {
      showLogin();
      return;
    }
  }
  initApp();
  showInstallBanner();
  startInactivityTracking();
}

bootApp();
</script>
