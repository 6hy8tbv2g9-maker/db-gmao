  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --accent: #e8970a; --success: #3fb950; --warning: #d29922;
      --danger: #f85149; --info: #58a6ff;
    }
    [data-theme="light"] {
      --bg: #f2f4f7; --surface: #ffffff; --surface2: #e9edf2;
      --border: #d0d7de; --text: #1f2328; --muted: #6b7280;
      --accent: #d97b06; --success: #1a7f37; --warning: #9a6700;
      --danger: #d1242f; --info: #0969da;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; overflow: hidden; }

    #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    #sb { height: env(safe-area-inset-top); background: var(--bg); flex-shrink: 0; }
    #content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

    /* NAV BAS */
    #nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
    #nav::-webkit-scrollbar { display: none; }
    .ni { flex: 1 0 auto; min-width: 60px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 9px; font-family: -apple-system, sans-serif; letter-spacing: 0.02em; position: relative; }
    .ni.on { color: var(--accent); }
    .ni-ic { font-size: 23px; line-height: 1; }
    .nb { position: absolute; top: 5px; right: calc(50% - 16px); background: var(--danger); color: #fff; border-radius: 10px; font-size: 9px; font-weight: 700; padding: 1px 5px; min-width: 16px; text-align: center; }

    /* HEADER PAGE */
    .ph { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); }
    .pt { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .ps { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin: 0 14px 12px; }
    .ci { padding: 13px 14px; border-bottom: 1px solid var(--border)22; display: flex; align-items: center; gap: 11px; cursor: pointer; -webkit-user-select: none; }
    .ci:last-child { border-bottom: none; }
    .ci:active { background: var(--surface2); }

    /* KPI */
    .kg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
    .kc { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px; }
    .kv { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 5px; }
    .kl { font-size: 12px; font-weight: 600; }
    .ks { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* BADGE */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

    /* SEARCH */
    .sc { padding: 10px 14px 0; position: sticky; top: 68px; background: var(--bg); z-index: 9; }
    .si { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px 14px; font-size: 15px; font-family: -apple-system, sans-serif; outline: none; }

    .fab { position: fixed; right: 18px; bottom: calc(68px + env(safe-area-inset-bottom) + 10px); width: 54px; height: 54px; border-radius: 27px; background: var(--accent); border: none; color: #000; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 18px rgba(232,151,10,.45); z-index: 20; font-weight: 300; }

    .mhd { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .mt { font-size: 17px; font-weight: 700; }
    .mc { background: var(--surface2); border: none; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 14px; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .mb { padding: 16px 18px; }

    /* FORM */
    .fi { margin-bottom: 14px; }
    .fl { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .inp, .sel, .ta { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 12px 13px; font-size: 15px; font-family: -apple-system, sans-serif; outline: none; -webkit-appearance: none; }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* BOUTONS */
    .bp { width: 100%; background: var(--accent); border: none; border-radius: 12px; color: #000; font-size: 16px; font-weight: 700; padding: 14px; cursor: pointer; font-family: -apple-system, sans-serif; margin-top: 6px; }
    .bs { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-size: 13px; font-weight: 600; padding: 7px 13px; cursor: pointer; font-family: -apple-system, sans-serif; }
    .bd { background: transparent; border: 1px solid var(--danger); border-radius: 9px; color: var(--danger); font-size: 14px; font-weight: 600; padding: 10px; cursor: pointer; font-family: -apple-system, sans-serif; width: 100%; margin-bottom: 10px; }
    .bq { background: rgba(88,166,255,.12); border: 1px solid rgba(88,166,255,.3); border-radius: 8px; color: var(--info); font-size: 12px; font-weight: 600; padding: 6px 10px; cursor: pointer; font-family: -apple-system, sans-serif; }

    /* QUANTITE STOCK */
    .qc { display: flex; align-items: center; gap: 10px; }
    .qb { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1; }

<script>
// ═══════════════════════════════════
// CONSTANTES & HELPERS
// ═══════════════════════════════════
const C = { accent:'#e8970a', success:'#3fb950', warning:'#d29922', danger:'#f85149', info:'#58a6ff', muted:'#8b949e', text:'#e6edf3' };

// ═══════════════════════════════════
// THÈME (sombre / clair)
// ═══════════════════════════════════
const getTheme = () => localStorage.getItem('gmao-theme') || 'dark';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'light' ? '#f2f4f7' : '#0d1117');
}
function setTheme(t) { localStorage.setItem('gmao-theme', t); applyTheme(t); render(); }
applyTheme(getTheme());

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const today = () => new Date().toISOString().split('T')[0];
const isOverdue = d => d && new Date(d) < new Date();
const daysUntil = d => d ? Math.ceil((new Date(d) - new Date()) / 86400000) : null;

// ═══════════════════════════════════
// JOURS FÉRIÉS FRANÇAIS + JOURS OUVRÉS
// ═══════════════════════════════════
function paques(year) {
  // Algorithme de Butcher pour calculer Pâques
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4;
  const l = (32+2*e+2*i-h-k) % 7, m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31), day = ((h+l-7*m+114) % 31)+1;
  return new Date(year, month-1, day);
}

function joursFeries(year) {
  const p = paques(year);
  const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return new Set([
    `${year}-01-01`,        // Jour de l'an
    fmt(addD(p,1)),         // Lundi de Pâques
    `${year}-05-01`,        // Fête du travail
    `${year}-05-08`,        // Victoire 1945
    fmt(addD(p,39)),        // Ascension
    fmt(addD(p,50)),        // Lundi de Pentecôte
    `${year}-07-14`,        // Fête nationale
    `${year}-08-15`,        // Assomption
    `${year}-11-01`,        // Toussaint
    `${year}-11-11`,        // Armistice
    `${year}-12-25`,        // Noël
  ]);
}

const ferieCache = {};
function isFerie(date) {
  const y = date.getFullYear();
  if (!ferieCache[y]) ferieCache[y] = joursFeries(y);
  const key = `${y}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  return ferieCache[y].has(key);
}

function isWeekend(date) {
  const d = date.getDay();
  return d === 0 || d === 6;
}

function isIndispo(date) {
  const t = date.getTime();
  return S.indisp.some(i => {
    const deb = new Date(i.dateDebut).getTime();
    const fin = new Date(i.dateFin).getTime();
    return t >= deb && t <= fin;
  });
}

function isJourOuvre(date) {
  return !isWeekend(date) && !isFerie(date) && !isIndispo(date);
}

// Trouve le jour ouvré le plus proche d'une date (avant ou après, priorité avant en égalité)
function jourOuvreProche(dateStr) {
  if (!dateStr) return dateStr;
  const date = new Date(dateStr);
  if (isJourOuvre(date)) return dateStr;
  // Chercher avant et après simultanément, max 30 jours
  for (let offset = 1; offset <= 30; offset++) {
    const avant = new Date(date); avant.setDate(avant.getDate() - offset);
    const apres = new Date(date); apres.setDate(apres.getDate() + offset);
    if (isJourOuvre(avant)) return `${avant.getFullYear()}-${String(avant.getMonth()+1).padStart(2,'0')}-${String(avant.getDate()).padStart(2,'0')}`;
    if (isJourOuvre(apres)) return `${apres.getFullYear()}-${String(apres.getMonth()+1).padStart(2,'0')}-${String(apres.getDate()).padStart(2,'0')}`;
  }
  return dateStr;
}
const fmt = d => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const statusCol = s => ({'en service':C.success,'en panne':C.danger,'en maintenance':C.warning,'hors service':C.muted,'ouvert':C.info,'en cours':C.warning,'terminé':C.success,'annulé':C.muted}[s]||C.muted);
const prioCol   = p => ({'urgent':C.danger,'haute':'#ff9580','normale':C.info,'basse':C.muted}[p]||C.muted);
const badge     = (l,col) => `<span class="badge" style="color:${col};background:${col}22;border:1px solid ${col}44">${esc(l)}</span>`;
const eqIcon    = t => ({'électrique':'⚡','hydraulique':'💧','pneumatique':'💨','mécanique':'⚙','thermique':'🔥'}[t]||'🔧');

const nextOT = ots => {
  const n = ots.map(o => parseInt(o.numero?.replace('OT-','')||'0')).filter(x=>!isNaN(x));
  return `OT-${String((n.length?Math.max(...n):0)+1).padStart(3,'0')}`;
};

const FREQ_DAYS = {hebdomadaire:7,mensuel:30,trimestriel:90,semestriel:182,annuel:365};
const SITES = ['Brasserie','Conditionnement','Prépa','Salem'];

// ═══════════════════════════════════
// QR
// ═══════════════════════════════════
const QR_PFX = 'GMAO|eq|';
const qrUrl   = (eq, sz=240) => `https://api.qrserver.com/v1/create-qr-code/?size=${sz}x${sz}&bgcolor=ffffff&color=0d1117&qzone=1&data=${encodeURIComponent(QR_PFX+eq.id)}`;
const parseQR = str => str.startsWith(QR_PFX) ? str.slice(QR_PFX.length) : null;

// ═══════════════════════════════════
// STORAGE
// ═══════════════════════════════════
// ═══════════════════════════════════
// SUPABASE
// ═══════════════════════════════════
const SUPABASE_URL = 'https://ehygoaorqrdknjrumvga.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoeWdvYW9ycXJka25qcnVtdmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNzQ5NjMsImV4cCI6MjA5NDY1MDk2M30.dsj9f6c21TBwmuulxFjN_Ug78lOSdlhCTkHAnDUTyQ0';

// Protection : si le SDK Supabase ne charge pas, on désactive le cloud et on tourne en local
let sb = null;
let cloudEnabled = false;
try {

// ═══════════════════════════════════
// AUTHENTIFICATION
// ═══════════════════════════════════
let currentUser = null;
let currentRole = 'lecteur';

// Récupère le rôle de l'utilisateur connecté
async function loadRole() {
  if (!cloudEnabled || !currentUser) { currentRole = 'lecteur'; return; }
  try {
    const { data, error } = await sb.from('profils').select('role').eq('id', currentUser.id).single();
    if (!error && data) currentRole = data.role || 'lecteur';
    else currentRole = 'lecteur';
  } catch(e) { currentRole = 'lecteur'; }
}

// Helpers de permission
const canWrite = () => ['technicien','manager'].includes(currentRole);
const canManage = () => currentRole === 'manager';
const canDelete = () => currentRole === 'manager';

async function checkAuth() {
  if (!cloudEnabled) return false;
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      currentUser = data.session.user;
      await loadRole();
      return true;
    }
  } catch(e) { console.warn('checkAuth:', e); }
  return false;
}

function showLogin(errorMsg) {
  const el = document.getElementById('app');
  if (!el) return;
  el.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)">
      <div style="width:100%;max-width:360px">
        <div style="text-align:center;margin-bottom:30px">
          <div style="font-size:44px;margin-bottom:10px">⚙️</div>
          <div style="font-size:24px;font-weight:800;color:var(--accent)">GMAO</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px">Connexion requise</div>
        </div>
        <div class="card" style="padding:20px">
          ${errorMsg ? `<div style="background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35);color:#f85149;padding:10px;border-radius:8px;font-size:13px;margin-bottom:14px">${esc(errorMsg)}</div>` : ''}
          <div class="fi"><label class="fl">Email</label><input class="inp" type="email" id="login-email" placeholder="votre@email.fr" autocomplete="username"/></div>
          <div class="fi"><label class="fl">Mot de passe</label><input class="inp" type="password" id="login-pwd" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
          <button class="bp" onclick="doLogin()" id="login-btn">Se connecter</button>
          <div style="text-align:center;margin-top:14px"><button onclick="forgotPasswordModal()" style="background:none;border:none;color:${C.info};font-size:13px;cursor:pointer;text-decoration:underline;font-family:-apple-system,sans-serif">Mot de passe oublié ?</button></div>
        </div>
        <div style="text-align:center;font-size:11px;color:var(--muted);margin-top:16px">Accès réservé · Contactez l'administrateur</div>
      </div>
    </div>
  `;
}

async function doLogin() {
  const email = document.getElementById('login-email')?.value.trim();
  const pwd = document.getElementById('login-pwd')?.value;
  const btn = document.getElementById('login-btn');
  if (!email || !pwd) { showLogin('Email et mot de passe requis'); return; }
  if (btn) { btn.textContent = 'Connexion…'; btn.disabled = true; }
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
    if (error) {
      showLogin('Identifiants incorrects');
      return;
    }
    currentUser = data.user;
    await loadRole();
    restoreAppStructure();
    initApp();
    startInactivityTracking();
  } catch(e) {
    showLogin('Erreur de connexion');
  }
}

// Restaure la structure de base de l'app (détruite par l'écran de login)
function restoreAppStructure() {
  const el = document.getElementById('app');
  if (el) {
    el.innerHTML = '<div id="sb"></div><div id="content"></div><nav id="nav"></nav>';
  }
}

async function doLogout() {
  if (!confirm('Se déconnecter ?')) return;
  try { await sb.auth.signOut(); } catch(e) {}
  currentUser = null;
  if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
  stopInactivityTimer();
  showLogin();
}

// ═══════════════════════════════════
// CODE PIN (verrouillage après inactivité)
// ═══════════════════════════════════
const PIN_TIMEOUT = 5 * 60 * 1000; // 5 minutes
let inactivityTimer = null;
let pinAttempts = 0;

// Hash simple du PIN (suffisant pour une barrière locale)
async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin + (currentUser?.id || 'gmao'));
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

const pinKey = () => `gmao-pin-${currentUser?.id || 'local'}`;
const hasPin = () => !!localStorage.getItem(pinKey());

async function setPin(pin) {
  const h = await hashPin(pin);
  localStorage.setItem(pinKey(), h);
}

function removePin() {
  localStorage.removeItem(pinKey());
}

async function verifyPin(pin) {
  const stored = localStorage.getItem(pinKey());
  if (!stored) return true;
  const h = await hashPin(pin);
  return h === stored;
}

// Timer d'inactivité : verrouille après 5 min sans activité
function resetInactivityTimer() {
  if (!hasPin()) return;
  if (inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => { lockApp(); }, PIN_TIMEOUT);
}

function stopInactivityTimer() {
  if (inactivityTimer) { clearTimeout(inactivityTimer); inactivityTimer = null; }
}

function startInactivityTracking() {
  if (!hasPin()) return;
  ['click','keydown','touchstart','scroll'].forEach(evt => {
    document.addEventListener(evt, resetInactivityTimer, { passive: true });
  });
  resetInactivityTimer();
}

// Affiche l'écran de verrouillage PIN
function lockApp() {
  if (!hasPin()) return;
  stopInactivityTimer();
  pinAttempts = 0;
  showPinScreen();
}

function showPinScreen(errorMsg) {
  const el = document.getElementById('app');
  if (!el) return;
  el.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)">
      <div style="width:100%;max-width:320px;text-align:center">

        <div style="font-size:13px;color:var(--muted);margin-bottom:24px">Entrez votre code PIN</div>
        ${errorMsg ? `<div style="background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35);color:#f85149;padding:10px;border-radius:8px;font-size:13px;margin-bottom:14px">${esc(errorMsg)}</div>` : ''}
        <input class="inp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="pin-input" placeholder="••••" style="text-align:center;font-size:28px;letter-spacing:12px;padding:14px" oninput="if(this.value.length>=4)checkPinUnlock()" autofocus/>
        <div style="margin-top:20px"><button class="bs" onclick="doLogout()" style="color:var(--muted)">Se déconnecter</button></div>
      </div>
    </div>
  `;
  setTimeout(() => document.getElementById('pin-input')?.focus(), 100);
}

async function checkPinUnlock() {
  const pin = document.getElementById('pin-input')?.value;
  if (!pin || pin.length < 4) return;
  const ok = await verifyPin(pin);
  if (ok) {
    pinAttempts = 0;
    restoreAppStructure();
    render();
    startInactivityTracking();
  } else {
    pinAttempts++;
    if (pinAttempts >= 5) {
      showToast('Trop de tentatives, déconnexion', '#f85149');
      setTimeout(() => doLogout(), 1000);
    } else {
      showPinScreen(`Code incorrect (${5 - pinAttempts} essai(s) restant(s))`);
    }
  }
}

const VAPID_PUBLIC_KEY = 'BFO6zNSEyxr8u9q8UpGI-yYsb86SrlflcMDD9wp9C4XvaaAr-tn-KLdbPePfImqJUT8vEwWvFuQscK51Wigmj0w';
let swRegistration = null;
let pushOn = false;

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const arr = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) arr[i] = rawData.charCodeAt(i);
  return arr;
}

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    swRegistration = await navigator.serviceWorker.register('./sw.js');
    return swRegistration;
  } catch (e) { console.warn('SW register:', e); return null; }
}

const pushSupported = () => ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
const isStandalonePWA = () => window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

async function isPushSubscribed() {
  if (!swRegistration) return false;
  try { return !!(await swRegistration.pushManager.getSubscription()); }
  catch(e) { return false; }
}

async function enablePush() {
  if (!pushSupported()) { alert("Ton appareil ou navigateur ne supporte pas les notifications push."); return; }
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS && !isStandalonePWA()) {
    alert("Sur iPhone : installe d'abord l'app sur l'écran d'accueil (bouton Partager → Sur l'écran d'accueil), ouvre-la depuis l'icône, puis réessaie ici.");
    return;
  }
  try {
    if (!swRegistration) await registerServiceWorker();
    if (!swRegistration) { alert("Service worker indisponible."); return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert("Notifications refusées. Tu peux les réautoriser dans les réglages de ton téléphone."); return; }
    const sub = await swRegistration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const j = sub.toJSON();
    const row = { user_id: currentUser.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth };
    await sb.from('push_subscriptions').delete().eq('endpoint', j.endpoint);
    const { error } = await sb.from('push_subscriptions').insert(row);
    if (error) { alert('Erreur enregistrement: ' + error.message); return; }
    pushOn = true;
    showToast('Notifications activées', C.success);
    render();
  } catch(e) { alert("Erreur lors de l'activation: " + e.message); }
}

async function disablePush() {
  try {
    if (!swRegistration) await registerServiceWorker();
    const sub = swRegistration ? await swRegistration.pushManager.getSubscription() : null;
    if (sub) {
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      if (cloudEnabled && currentUser) await sb.from('push_subscriptions').delete().eq('endpoint', endpoint);
    }
    pushOn = false;
    showToast('Notifications désactivées', C.success);
    render();
  } catch(e) { alert("Erreur: " + e.message); }
}

// Libellé d'un opérateur : son nom si défini, sinon l'email
const operateurLabel = (p) => ((p.nom||'').trim() || p.email || '').trim();

// Enregistre le nom d'affichage d'un compte (manager uniquement)
async function saveOperateurNom(userId, nom) {
  if (!cloudEnabled) return;
  try {
    const { error } = await sb.from('profils').update({ nom: (nom||'').trim() }).eq('id', userId);
    if (error) { alert('Erreur : ' + error.message); return; }

    showToast('Nom enregistré', C.success);
    render();

}

// Un compte est-il un opérateur (proposé dans les listes) ?
// Flag explicite prioritaire ; sinon, par défaut les techniciens le sont.
function estOperateur(o) {
  if (o.est_operateur === true) return true;
  if (o.est_operateur === false) return false;
  return o.role === 'technicien';
}

// Liste triée et dédoublonnée des noms d'opérateurs
function operateurNoms() {
  const noms = S.operateurs.filter(estOperateur).map(operateurLabel).filter(Boolean);
  return [...new Set(noms)].sort((a,b)=>a.localeCompare(b,'fr'));
}

// Active/désactive un compte comme opérateur (manager uniquement)
async function toggleOperateur(userId, val) {
  if (!cloudEnabled) return;
  try {
    const { error } = await sb.from('profils').update({ est_operateur: val }).eq('id', userId);
    if (error) { alert('Erreur : ' + error.message); return; }
    const op = S.operateurs.find(o => o.id === userId);
    if (op) op.est_operateur = val;
    render();
  } catch(e) { alert('Erreur lors de l\'enregistrement'); }
}

// Génère les <option> d'un select opérateur (préserve une valeur historique éventuelle)
function operateurOptions(selected) {
  const uniq = operateurNoms();
  let opts = `<option value="">— Opérateur —</option>`;
  if (selected && !uniq.includes(selected)) {
    opts += `<option value="${esc(selected)}" selected>${esc(selected)}</option>`;
  }
  opts += uniq.map(n => `<option ${selected===n?'selected':''}>${esc(n)}</option>`).join('');
  return opts;
}

// Mapping camelCase JS ⇄ snake_case DB
const camelToSnake = {
  equipementId: 'equipement_id',
  dateMAJ: 'date_maj',
  dateCreation: 'date_creation',
  datePrevue: 'date_prevue',
  dateCloture: 'date_cloture',
  dateDebut: 'date_debut',
  dateFin: 'date_fin',
  dureeH: 'duree_h',
  coutMO: 'cout_mo',
  coutPieces: 'cout_pieces',
  coutTotal: 'cout_total',
  dernierPassage: 'dernier_passage',
  prochaineEcheance: 'prochaine_echeance',
  seuilAlerte: 'seuil_alerte',
  prixUnitaire: 'prix_unitaire',
  otId: 'ot_id',
  pieceId: 'piece_id',
  parentType: 'parent_type',
  parentId: 'parent_id',
  typeFichier: 'type_fichier',
  storagePath: 'storage_path',
  dateAjout: 'date_ajout',
  piecesPrevues: 'pieces_prevues',
};
const snakeToCamel = Object.fromEntries(Object.entries(camelToSnake).map(([k,v])=>[v,k]));

const toDB = (obj) => {
  const out = {};
  const dateFields = ['datePrevue','dateCloture','dateDebut','dateFin','dateCreation','dateAjout','prochaineEcheance','derniereExecution'];
  for (const [k,v] of Object.entries(obj)) {
    let val = v;
    // Chaînes vides sur les champs date → null (sinon PostgreSQL rejette)
    if (dateFields.includes(k) && val === '') val = null;
    out[camelToSnake[k] || k] = val;
  }
  return out;
};
const fromDB = (obj) => {
  const out = {};
  for (const [k,v] of Object.entries(obj)) {
    if (k === 'updated_at') continue;
    out[snakeToCamel[k] || k] = v;
  }
  return out;
};

const TABLES = { eq: 'equipements', ots: 'ots', prev: 'preventif', stock: 'stock', otPieces: 'ot_pieces', settings: 'settings', docs: 'documents', indisp: 'indisponibilites' };

// Chargement initial depuis Supabase
async function loadFromCloud() {
  if (!cloudEnabled) throw new Error('Cloud désactivé');
  const load = async (table) => {
    try {
      const { data, error } = await sb.from(table).select('*');
      if (error) { console.warn(`Load ${table}:`, error.message); return []; }
      return (data || []).map(fromDB);
    } catch(e) { console.warn(`Load ${table} exception:`, e); return []; }
  };
  const [eq, ots, prev, stock, otPieces, settings, docs, indisp] = await Promise.all([
    load('equipements'), load('ots'), load('preventif'), load('stock'),
    load('ot_pieces'), load('settings'), load('documents'), load('indisponibilites'),
  ]);
  return { eq, ots, prev, stock, otPieces, settings, docs, indisp };
}

// Upsert (création ou mise à jour) d'une ligne
async function upsertRow(tableKey, row) {
  if (!cloudEnabled) return;
  const { error } = await sb.from(TABLES[tableKey]).upsert(toDB(row));
  if (error) console.error('Upsert:', error);
}

// Suppression
async function deleteRow(tableKey, id) {
  if (!cloudEnabled) return;
  const { error } = await sb.from(TABLES[tableKey]).delete().eq('id', id);
  if (error) console.error('Delete:', error);
}

// Subscribe temps réel : écoute les changements sur toutes les tables
let realtimeChannels = [];
let pollingInterval = null;

function subscribeAll() {
  if (!cloudEnabled) return;
  // Nettoyer l'ancien polling
  if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
  // Polling toutes les 30 secondes
  pollingInterval = setInterval(async () => {
    if (!cloudEnabled || !S.online) return;
    try {
      const data = await loadFromCloud();
      let changed = false;
      if (JSON.stringify(data.eq) !== JSON.stringify(S.eq)) { S.eq = data.eq; changed = true; }
      if (JSON.stringify(data.ots) !== JSON.stringify(S.ots)) { S.ots = data.ots; changed = true; }
      if (JSON.stringify(data.prev) !== JSON.stringify(S.prev)) { S.prev = data.prev; changed = true; }
      if (JSON.stringify(data.stock) !== JSON.stringify(S.stock)) { S.stock = data.stock; changed = true; }
      if (JSON.stringify(data.otPieces) !== JSON.stringify(S.otPieces)) { S.otPieces = data.otPieces; changed = true; }
      if (JSON.stringify(data.docs) !== JSON.stringify(S.docs)) { S.docs = data.docs; changed = true; }
      if (JSON.stringify(data.indisp) !== JSON.stringify(S.indisp)) { S.indisp = data.indisp; changed = true; }
      if (changed) { saveAll(); render(); }
    } catch(e) { console.warn('Polling error:', e); }
  }, 30000);
}

// Helper pour récupérer un setting
const getSetting = (key, fallback='') => {
  const s = S.settings.find(x => x.key === key);
  return s ? s.value : fallback;
};
const setSetting = async (key, value) => {
  let s = S.settings.find(x => x.key === key);
  if (s) { s.value = value; S.settings = S.settings.map(x => x.id===s.id?s:x); }
  else { s = { id: 's-' + uid(), key, value }; S.settings = [...S.settings, s]; }
  await syncSave('settings', s);
};

// Tracker écritures en cours pour éviter d'écraser une saisie utilisateur
let writesPending = 0;

// Mise à jour optimiste + sync cloud
async function syncSave(tableKey, row) {
  writesPending++;
  // 1. Mise à jour locale immédiate (déjà faite par l'appelant)
  // 2. Sauvegarde dans le cloud
  try { await upsertRow(tableKey, row); }
  catch(e) { console.error('Sync save:', e); }
  finally { writesPending--; }
  // 3. Cache local de secours
  lsSave(`gmao-${tableKey}`, S[tableKey]);
}

async function syncDelete(tableKey, id) {
  writesPending++;
  try { await deleteRow(tableKey, id); }
  catch(e) { console.error('Sync delete:', e); }
  finally { writesPending--; }
  lsSave(`gmao-${tableKey}`, S[tableKey]);
}

  lsSave('gmao-eq', S.eq);

  lsSave('gmao-otPieces', S.otPieces);

}

function render() {
  renderNav();

  const focusedId = document.activeElement?.id;
  const focusedVal = document.activeElement?.value;

  const fn = {dashboard:pgDashboard,equipements:pgEquipements,ots:pgOTs,preventif:pgPreventif,stock:pgStock,stats:pgStats,settings:pgSettings};
  document.getElementById('content').innerHTML = (fn[S.page]||pgDashboard)();

  // Restore search focus after re-render
  if (wasFocused && focusedId) {
    const el = document.getElementById(focusedId);
    if (el) { el.focus(); el.setSelectionRange && el.setSelectionRange(el.value.length,el.value.length); }
  }

  // Met à jour l'état des notifications push sur la page Réglages
  if (S.page === 'settings' && pushSupported()) {
    isPushSubscribed().then(on => {
      if (on !== pushOn) { pushOn = on; render(); }
    });
  }
}

function saveEq(id) {

  const row = id ? {...S.eq.find(e=>e.id===id), ...d} : {id:uid(), ...d};
  if (id) S.eq=S.eq.map(e=>e.id===id?row:e);

function delEq(id) {

  S.eq=S.eq.filter(e=>e.id!==id);
  syncDelete('eq', id); closeModal(); render();
}

async function startScanner() {
  const stEl=document.getElementById('scan-st');
  const vid=document.getElementById('scan-vid');
  const cv=document.getElementById('scan-cv');
  if (!vid||!cv) return;

  // jsQR doit déjà être chargé via le <script> du head
  // Si jamais il manque, on essaie de le charger
  if (!window.jsQR) {
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    document.head.appendChild(s);
  }

  // Vérifier que l'API caméra existe
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (stEl) stEl.innerHTML=`<span style="color:${C.danger}">⚠ API caméra non disponible sur ce navigateur</span>`;
    return;
  }

  // Demander la caméra
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
  } catch(e1) {
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch(e2) {
      if (stEl) {
        if (e2.name === 'NotAllowedError') {
          stEl.innerHTML = `<span style="color:${C.danger}">⚠ Accès caméra refusé. Réglages iPhone → GMAO → Caméra.</span>`;
        } else if (e2.name === 'NotFoundError') {
          stEl.innerHTML = `<span style="color:${C.danger}">⚠ Aucune caméra détectée</span>`;
        } else {
          stEl.innerHTML = `<span style="color:${C.danger}">⚠ Caméra non disponible (${e2.name})</span>`;
        }
      }
      return;
    }
  }

  // Brancher le flux vidéo
  try {
    vid.srcObject = scanStream;
    vid.setAttribute('playsinline', 'true');
    vid.setAttribute('muted', 'true');
    await vid.play();
    if (stEl) stEl.textContent = 'Pointez vers un QR code GMAO';
  } catch(e) {
    if (stEl) stEl.innerHTML = `<span style="color:${C.danger}">⚠ Lecture vidéo impossible</span>`;
    stopScanner();
    return;
  }

  scanTick(vid, cv);
}

function scanTick(vid,cv) {
  if (!vid || !cv) return;

  // Si jsQR pas encore chargé, attendre
  if (!window.jsQR) {
    const stEl = document.getElementById('scan-st');
    if (stEl && stEl.textContent !== 'Chargement du décodeur QR…') {
      stEl.textContent = 'Chargement du décodeur QR…';
    }
    scanRAF = requestAnimationFrame(() => scanTick(vid, cv));
    return;
  }

  if (vid.readyState >= vid.HAVE_ENOUGH_DATA && vid.videoWidth > 0) {
    cv.width = vid.videoWidth;
    cv.height = vid.videoHeight;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(vid, 0, 0, cv.width, cv.height);
    const img = ctx.getImageData(0, 0, cv.width, cv.height);

    // Essai 1 : décodage normal
    let code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });

    if (code && code.data) {
      const eqId = parseQR(code.data);
      if (eqId) {
        const eq = S.eq.find(e => e.id === eqId);
        if (eq) {
          stopScanner();
          showScanResult(eq);
          return;
        } else {
          // QR scanné mais équipement introuvable dans la base
          const stEl = document.getElementById('scan-st');
          if (stEl) stEl.innerHTML = `<span style="color:${C.warning}">⚠ QR reconnu mais équipement introuvable</span>`;
        }
      } else {
        // QR détecté mais pas un QR GMAO
        const stEl = document.getElementById('scan-st');
        if (stEl) stEl.innerHTML = `<span style="color:${C.warning}">⚠ Ce n'est pas un QR de cette GMAO</span>`;
      }
    }
  }
  scanRAF = requestAnimationFrame(() => scanTick(vid, cv));
}

function stopScanner() {
  if (scanStream) { scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF=null; }
}

function closeScanner() { stopScanner(); closeModal(); }

          ${otsActifs?`<span style="color:${C.warning}">🔧 ${otsActifs} OT actif(s)</span>`:''}
          ${prevEnRetard?`<span style="color:${C.danger}">⚠ ${prevEnRetard} prév. en retard</span>`:''}
          ${prevAVenir?`<span style="color:${C.info}">📅 ${prevAVenir} prév. à venir</span>`:''}

      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:8px">Que voulez-vous faire ?</div>

function saveQuickPanne(eqId, numero) {
  const desc = document.getElementById('qp-desc').value.trim();
  if (!desc) { alert('Décrivez la panne'); return; }
  const newOT = {
    id: uid(),
    numero,
    titre: desc.length>40 ? desc.slice(0,37)+'...' : desc,
    equipementId: eqId,
    type: 'correctif',
    priorite: document.getElementById('qp-pri').value,
    statut: 'ouvert',
    description: desc,
    dateCreation: today(),
    datePrevue: today(),
    dateCloture: '',
    technicien: document.getElementById('qp-tech').value,
    observations: '',
  };
  S.ots = [...S.ots, newOT];
  syncSave('ots', newOT);
  notifyNewOT(newOT);

  // Mettre à jour le statut de la machine
  const newStatut = document.getElementById('qp-statut').value;
  const eq = S.eq.find(e=>e.id===eqId);
  if (eq && eq.statut !== newStatut) {
    const updated = {...eq, statut: newStatut, dateMAJ: today()};
    S.eq = S.eq.map(e=>e.id===eqId?updated:e);
    syncSave('eq', updated);
  }
  closeModal();
  showToast(`OT ${numero} créé`, C.success);
  S.page = 'ots';
  render();
}

  const otsActifs = S.ots.filter(o => o.equipementId === eqId && !['terminé','annulé'].includes(o.statut));

    openModal(`

      <div class="mb"><div style="text-align:center;padding:30px 0;color:var(--muted)">Pas d'OT en cours pour <strong>${esc(eq.nom)}</strong></div>
      <button class="bp" onclick="closeModal();quickPanne('${eqId}')">Créer un OT</button></div>

  openModal(`
    <div class="mh"></div>
    <div class="mhd"><span class="mt">✓ Valider OT — ${esc(eq.nom)}</span><button class="mc" onclick="closeModal()">×</button></div>

function confirmValiderOT(otId) {
  const ot = S.ots.find(o => o.id === otId);
  if (!ot) return;
  closeModal();
  // Pré-remplir la fin avec maintenant
  const now = new Date();
  const nowISO = now.toISOString();
  openModal(`
    <div class="mh"></div>
    <div class="mhd"><span class="mt">✓ Valider — ${esc(ot.numero)}</span><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div style="background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25);border-radius:10px;padding:10px;margin-bottom:14px;font-size:13px">
        <strong>${esc(ot.titre)}</strong>
      </div>
      <div class="g2">
        <div class="fi"><label class="fl">Début</label><input class="inp" type="datetime-local" id="val-debut" value="${ot.dateDebut ? new Date(ot.dateDebut).toISOString().slice(0,16) : ''}"/></div>
        <div class="fi"><label class="fl">Fin</label><input class="inp" type="datetime-local" id="val-fin" value="${nowISO.slice(0,16)}"/></div>
      </div>
      <div class="fi"><label class="fl">Opérateur</label><select class="sel" id="val-tech">${operateurOptions(ot.technicien)}</select></div>
      <div class="fi"><label class="fl">Observations / compte-rendu</label><textarea class="ta" id="val-obs" placeholder="Action réalisée, résultat...">${esc(ot.observations||'')}</textarea></div>
      <button class="bp" onclick="finishValiderOT('${otId}')">✓ Marquer terminé</button>
    </div>
  `);
}

function finishValiderOT(otId) {
  const ot = S.ots.find(o => o.id === otId);
  if (!ot) return;
  const debutV = document.getElementById('val-debut').value;
  const finV = document.getElementById('val-fin').value;
  const obs = document.getElementById('val-obs').value;
  const dtToISO = (v) => v ? new Date(v).toISOString() : '';
  const dateDebut = dtToISO(debutV);
  const dateFin = dtToISO(finV);
  let dureeH = ot.dureeH || 0;
  if (debutV && finV) {
    const ms = new Date(finV) - new Date(debutV);
    if (ms > 0) dureeH = Number((ms / 3600000).toFixed(2));
  }
  const tarifH = Number(getSetting('tarif_horaire', '45')) || 45;
  const coutMO = Number((dureeH * tarifH).toFixed(2));
  const coutPieces = Number(ot.coutPieces) || 0;
  const coutTotal = coutMO + coutPieces;
  const valTech = document.getElementById('val-tech')?.value || ot.technicien || '';
  const newOT = {
    ...ot,
    statut: 'terminé',
    dateDebut, dateFin,
    dureeH, coutMO, coutTotal,
    dateCloture: today(),
    technicien: valTech,
    observations: obs,
  };
  S.ots = S.ots.map(o => o.id === otId ? newOT : o);
  syncSave('ots', newOT);
  closeModal();
  showToast('OT validé ✓', '#3fb950');
  render();
}

      </div>

      <div style="display:flex;gap:8px">
        <div class="fi" style="flex:1"><label class="fl">Début *</label><input class="inp" type="datetime-local" id="qpv-debut"/></div>
        <div class="fi" style="flex:1"><label class="fl">Fin *</label><input class="inp" type="datetime-local" id="qpv-fin"/></div>
      </div>
      <div class="fi"><label class="fl">Opérateur *</label><select class="sel" id="qpv-tech">${operateurOptions('')}</select></div>
      <button class="bp" onclick="saveQuickPreventif('${eqId}')">Valider les gammes cochées</button>
    </div>
  `);
}

function saveQuickPreventif(eqId) {
  const tech = document.getElementById('qpv-tech').value;
  const debut = document.getElementById('qpv-debut')?.value;
  const fin = document.getElementById('qpv-fin')?.value;
  const list = S.prev.filter(p => p.equipementId === eqId);

  // Contrôles obligatoires
  const cochees = list.filter(p => document.getElementById('qpv-'+p.id)?.checked);
  if (cochees.length === 0) { alert('Cochez au moins une gamme à valider.'); return; }
  if (!debut || !fin) { alert("Renseignez l'heure de début et de fin."); return; }
  if (new Date(fin) <= new Date(debut)) { alert("L'heure de fin doit être après l'heure de début."); return; }
  if (!tech) { alert('Sélectionnez un opérateur.'); return; }

  const dureeH = Math.round(((new Date(fin) - new Date(debut)) / 3600000) * 100) / 100;
  let count = 0;
  let alertesStock = [];
  cochees.forEach(p => {
    {
      const d = new Date(); d.setDate(d.getDate()+(FREQ_DAYS[p.frequence]||30));
      let nextDate = d.toISOString().split('T')[0];
      // Appliquer décalage jour ouvré
      nextDate = jourOuvreProche(nextDate);
      const updated = {...p, dernierPassage:today(), prochaineEcheance:nextDate, dateDebut:debut, dateFin:fin, dureeH, technicien:tech};
      S.prev = S.prev.map(x=>x.id===p.id?updated:x);
      syncSave('prev', updated);
      // Consommer les pièces prévues
      const piecesPrev = Array.isArray(p.piecesPrevues) ? p.piecesPrevues : [];
      piecesPrev.forEach(pp => {
        const stk = S.stock.find(s => s.id === pp.pieceId);
        if (stk) {
          const newQte = Math.max(0, stk.quantite - pp.quantite);
          if (stk.quantite < pp.quantite) alertesStock.push(stk.designation);
          const newStk = {...stk, quantite: newQte};
          S.stock = S.stock.map(s => s.id === pp.pieceId ? newStk : s);
          syncSave('stock', newStk);
        }
      });
      count++;
    }
  });
  closeModal();
  if (count) showToast(`${count} gamme(s) validée(s)`, C.success);
  if (alertesStock.length > 0) {
    setTimeout(() => alert(`⚠ Stock insuffisant pour : ${alertesStock.join(', ')}`), 500);
  }
  render();
}

  const q=S.search.ots.toLowerCase(), f=S.otFilter;
  const list=S.ots.filter(o=>{
    const eq=S.eq.find(e=>e.id===o.equipementId);
    const matchTxt = (o.titre.toLowerCase().includes(q)||o.numero?.includes(q)||eq?.nom.toLowerCase().includes(q));

  return `

      <div class="fi"><label class="fl" style="color:${C.accent}">💰 COÛT TOTAL OT</label><input class="inp" type="number" id="otct" value="${(Number(f.coutMO||0)+coutPiecesAuto).toFixed(2)}" readonly style="opacity:.7;color:${C.accent};font-weight:700;font-size:16px"/></div>

// Calcule la durée automatiquement à partir de début + fin
function updateDureeAuto() {
  const debut = document.getElementById('otdd')?.value;
  const fin = document.getElementById('otdf')?.value;
  if (debut && fin) {
    const ms = new Date(fin) - new Date(debut);
    if (ms > 0) {
      const heures = (ms / 3600000).toFixed(2);
      const elDH = document.getElementById('otdh');
      if (elDH) { elDH.value = heures; updateCoutMO(); }
    }
  }
}

// Recalcule le coût MO en temps réel
function updateCoutMO() {
  const tarifH = Number(getSetting('tarif_horaire', '45')) || 45;
  const duree = Number(document.getElementById('otdh').value) || 0;
  const cmo = (duree * tarifH).toFixed(2);
  const elMO = document.getElementById('otcmo');
  if (elMO) elMO.value = cmo;
  const elCP = document.getElementById('otcp');
  const cp = elCP ? Number(elCP.value)||0 : 0;
  const elCT = document.getElementById('otct');
  if (elCT) elCT.value = (Number(cmo) + cp).toFixed(2);
}

function saveOT(id) {
  const titre=document.getElementById('ott').value.trim();
  if (!titre) { alert('Titre obligatoire'); return; }
  const dureeH = Number(document.getElementById('otdh')?.value)||0;
  const coutMO = Number(document.getElementById('otcmo')?.value)||0;
  const coutPieces = Number(document.getElementById('otcp')?.value)||0;
  const coutTotal = coutMO + coutPieces;
  // Convertir datetime-local en ISO
  const dtToISO = (v) => v ? new Date(v).toISOString() : '';
  const d = {
    titre,
    equipementId:document.getElementById('oteq').value,
    type:document.getElementById('otty').value,
    priorite:document.getElementById('otpr').value,
    statut:document.getElementById('otst').value,
    technicien:document.getElementById('ottech').value,
    datePrevue:document.getElementById('otd').value,
    dateCloture:document.getElementById('otc').value,
    dateDebut:dtToISO(document.getElementById('otdd')?.value),
    dateFin:dtToISO(document.getElementById('otdf')?.value),
    dureeH,coutMO,coutPieces,coutTotal,
    description:document.getElementById('otdes').value,
    observations:document.getElementById('otob').value
  };
  const row = id ? {...S.ots.find(o=>o.id===id), ...d} : {id:uid(), numero:nextOT(S.ots), dateCreation:today(), ...d};
  if (id) S.ots=S.ots.map(o=>o.id===id?row:o);
  else { S.ots=[...S.ots, row]; notifyNewOT(row); }
  syncSave('ots', row);
  // Si création : déplacer les pièces temporaires vers l'OT créé
  if (!id && window._tmpPieces && window._tmpPieces.length > 0) {
    for (const tp of window._tmpPieces) {
      const piece = {...tp, otId: row.id};
      S.otPieces = [...S.otPieces, piece];
      syncSave('otPieces', piece);
      // Décrémenter le stock
      const stk = S.stock.find(s => s.id === piece.pieceId);
      if (stk) {
        const newStk = {...stk, quantite: Math.max(0, stk.quantite - piece.quantite)};
        S.stock = S.stock.map(s => s.id === piece.pieceId ? newStk : s);
        syncSave('stock', newStk);
      }
    }
    window._tmpPieces = [];
  }
  closeModal(); render();
}

// Pièces temporaires (avant création OT)
function openAddPieceTmp() {
  const stocks = S.stock.filter(s => s.quantite > 0);
  if (stocks.length === 0) { alert('Aucune pièce en stock.'); return; }
  // Mémoriser le formulaire OT en cours pour pouvoir y revenir
  const otFormState = {
    titre: document.getElementById('ott')?.value || '',
    equipementId: document.getElementById('oteq')?.value || '',
    type: document.getElementById('otty')?.value || 'correctif',
    priorite: document.getElementById('otpr')?.value || 'normale',
    statut: document.getElementById('otst')?.value || 'ouvert',
    technicien: document.getElementById('ottech')?.value || '',
    datePrevue: document.getElementById('otd')?.value || '',
    dateCloture: document.getElementById('otc')?.value || '',
    dateDebut: document.getElementById('otdd')?.value || '',
    dateFin: document.getElementById('otdf')?.value || '',
    dureeH: document.getElementById('otdh')?.value || '0',
    description: document.getElementById('otdes')?.value || '',
    observations: document.getElementById('otob')?.value || '',
  };
  window._otFormState = otFormState;
  openModal(`
    <div class="mh"></div>
    <div class="mhd"><span class="mt">Ajouter une pièce</span><button class="mc" onclick="restoreOTForm()">×</button></div>
    <div class="mb">
      <div class="fi"><label class="fl">Pièce</label><select class="sel" id="addp-piece">
        ${stocks.map(s => `<option value="${s.id}">${esc(s.designation)} (stock: ${s.quantite})</option>`).join('')}
      </select></div>
      <div class="fi"><label class="fl">Quantité</label><input class="inp" type="number" min="1" id="addp-qte" value="1"/></div>
      <button class="bp" onclick="saveTmpPiece()">Ajouter</button>
    </div>
  `);
}

function saveTmpPiece() {
  const pieceId = document.getElementById('addp-piece').value;
  const qte = Number(document.getElementById('addp-qte').value) || 1;
  const stk = S.stock.find(s => s.id === pieceId);
  if (!stk) return;
  if (qte > stk.quantite) { alert(`Stock insuffisant (${stk.quantite} dispo)`); return; }
  window._tmpPieces = window._tmpPieces || [];
  window._tmpPieces.push({
    id: uid(),
    otId: null,  // sera défini à la création
    pieceId,
    quantite: qte,
    prixUnitaire: Number(stk.prixUnitaire) || 0,
  });
  restoreOTForm();
}

function removeTmpPiece(id) {
  window._tmpPieces = (window._tmpPieces || []).filter(p => p.id !== id);
  restoreOTForm();
}

function restoreOTForm() {
  closeModal();
  modalOT(null);
  // Restaurer les valeurs
  setTimeout(() => {
    const st = window._otFormState || {};
    const set = (id, val) => { const e = document.getElementById(id); if (e && val !== undefined) e.value = val; };
    set('ott', st.titre); set('oteq', st.equipementId); set('otty', st.type);
    set('otpr', st.priorite); set('otst', st.statut); set('ottech', st.technicien);
    set('otd', st.datePrevue); set('otc', st.dateCloture);
    set('otdd', st.dateDebut); set('otdf', st.dateFin);
    set('otdh', st.dureeH); set('otdes', st.description); set('otob', st.observations);
    updateCoutMO();
  }, 50);
}

    <div class="mb">
      <div class="fi"><label class="fl">Pièce *</label><select class="sel" id="ap-id" onchange="updateAPInfo()">
        <option value="">— Sélectionner —</option>
        ${stocks.map(s => `<option value="${s.id}">${esc(s.designation)} (${s.reference}) · stock: ${s.quantite}</option>`).join('')}
      </select></div>
      <div class="g2">
        <div class="fi"><label class="fl">Quantité</label><input class="inp" type="number" min="0.01" step="0.01" id="ap-qte" value="1"/></div>
        <div class="fi"><label class="fl">Prix unit. (€)</label><input class="inp" type="number" min="0" step="0.01" id="ap-pu" value="0"/></div>
      </div>
      <div id="ap-warn" style="font-size:11px;color:var(--muted);margin-bottom:10px"></div>
      <button class="bp" onclick="saveOTPiece('${otId}')">Ajouter au OT</button>
      <button class="bs" style="width:100%;margin-top:8px" onclick="closeModal();modalOT('${otId}')">Annuler</button>
    </div>
  `);
}

function updateAPInfo() {
  const id = document.getElementById('ap-id').value;
  const s = S.stock.find(x => x.id === id);
  if (s) {
    document.getElementById('ap-pu').value = Number(s.prixUnitaire||0).toFixed(2);
    document.getElementById('ap-warn').innerHTML = `Stock dispo : <strong style="color:${C.success}">${s.quantite}</strong>`;
  }
}

function saveOTPiece(otId) {
  const pieceId = document.getElementById('ap-id').value;
  if (!pieceId) { alert('Sélectionnez une pièce'); return; }
  const qte = Number(document.getElementById('ap-qte').value)||0;
  const pu = Number(document.getElementById('ap-pu').value)||0;
  if (qte <= 0) { alert('Quantité invalide'); return; }
  const stk = S.stock.find(s=>s.id===pieceId);
  if (!stk) return;
  if (qte > stk.quantite) {
    if (!confirm(`Stock insuffisant (${stk.quantite} dispo). Continuer quand même ?`)) return;
  }
  // Créer la liaison
  const row = { id: uid(), otId, pieceId, quantite: qte, prixUnitaire: pu };
  S.otPieces = [...S.otPieces, row];
  syncSave('otPieces', row);
  // Décrémenter le stock
  const newStk = {...stk, quantite: Math.max(0, stk.quantite - qte)};
  S.stock = S.stock.map(s=>s.id===pieceId?newStk:s);
  syncSave('stock', newStk);
  closeModal();
  modalOT(otId); // Rouvrir l'OT avec la pièce ajoutée
}

function removeOTPiece(linkId, otId) {
  if (!confirm('Retirer cette pièce ? (le stock sera rétabli)')) return;
  const link = S.otPieces.find(p=>p.id===linkId);
  if (!link) return;
  // Restituer au stock
  const stk = S.stock.find(s=>s.id===link.pieceId);
  if (stk) {
    const newStk = {...stk, quantite: stk.quantite + link.quantite};
    S.stock = S.stock.map(s=>s.id===link.pieceId?newStk:s);
    syncSave('stock', newStk);
  }
  S.otPieces = S.otPieces.filter(p=>p.id!==linkId);
  syncDelete('otPieces', linkId);
  closeModal();
  modalOT(otId);
}

function delOT(id) {
  if (!confirm('Supprimer ?')) return;
  S.ots=S.ots.filter(o=>o.id!==id);
  syncDelete('ots', id); closeModal(); render();
}

// DOCUMENTS (PDF, photos, schémas)

const BUCKET = 'gmao-files';

// Upload d'un fichier vers Supabase Storage
async function uploadFile(file, parentType, parentId) {
  if (!cloudEnabled) {
    alert('Cloud non disponible. Connexion requise pour uploader des documents.');
    return null;
  }
  // Limite : 10 Mo
  if (file.size > 10 * 1024 * 1024) {
    alert('Fichier trop volumineux (max 10 Mo)');
    return null;
  }
  // Nom unique
  const ext = file.name.split('.').pop();
  const path = `${parentType}/${parentId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;

  showToast('Upload en cours…', '#58a6ff');
  const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file);
  if (upErr) {
    console.error('Upload:', upErr);
    showToast('Erreur upload: ' + upErr.message, '#f85149');
    return null;
  }
  const doc = {
    id: uid(),
    parentType,
    parentId,
    nom: file.name,
    typeFichier: file.type || ext,
    taille: file.size,
    url: '',
    storagePath: path,
    dateAjout: today(),
  };
  S.docs = [...S.docs, doc];
  await syncSave('docs', doc);
  showToast('Document ajouté', '#3fb950');
  return doc;
}

// Ouvre un document via une URL signée temporaire (valable 1h)
async function openDoc(storagePath) {
  if (!cloudEnabled || !storagePath) { alert('Document indisponible'); return; }
  showToast('Ouverture…', '#58a6ff');
  try {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(storagePath, 3600);
    if (error || !data) { alert('Impossible d\'ouvrir ce document'); return; }
    window.open(data.signedUrl, '_blank');
  } catch(e) {
    alert('Erreur d\'ouverture');
  }
}

async function deleteDoc(docId) {
  if (!confirm('Supprimer ce document ?')) return;
  const doc = S.docs.find(d => d.id === docId);
  if (!doc) return;
  if (cloudEnabled && doc.storagePath) {
    await sb.storage.from(BUCKET).remove([doc.storagePath]);
  }
  S.docs = S.docs.filter(d => d.id !== docId);
  await syncDelete('docs', docId);
  showToast('Document supprimé', '#3fb950');
  return true;
}

// Renvoie une icône selon le type de fichier
const docIcon = (type, nom) => {
  const ext = (nom || '').split('.').pop().toLowerCase();
  if (/pdf/i.test(type) || ext === 'pdf') return '📄';
  if (/image|jpe?g|png|gif|webp|heic/i.test(type) || /jpe?g|png|gif|webp|heic/i.test(ext)) return '🖼️';
  if (/word|doc/i.test(type) || /docx?$/.test(ext)) return '📝';
  if (/excel|sheet|csv/i.test(type) || /xlsx?|csv$/.test(ext)) return '📊';
  if (/video/i.test(type) || /mp4|mov|avi/i.test(ext)) return '🎬';
  return '📎';
};

const fmtSize = (b) => {
  if (b < 1024) return b + ' o';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' Ko';
  return (b/1024/1024).toFixed(1) + ' Mo';
};

// Render une section "Documents" attachée à un parent (equipement ou OT)
function renderDocsSection(parentType, parentId) {
  const list = S.docs.filter(d => d.parentType === parentType && d.parentId === parentId);
  const rows = list.length === 0
    ? `<div style="padding:14px;color:var(--muted);font-size:12px;text-align:center;font-style:italic">Aucun document</div>`
    : list.map(d => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)22">
          <div style="font-size:22px;flex-shrink:0">${docIcon(d.typeFichier, d.nom)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.nom)}</div>
            <div style="font-size:11px;color:var(--muted)">${fmtSize(d.taille||0)} · ${fmt(d.dateAjout)}</div>
          </div>
          <button onclick="openDoc('${d.storagePath}')" style="background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);color:${C.info};font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-family:-apple-system,sans-serif">Ouvrir</button>
          ${canDelete()?`<button onclick="onDeleteDoc('${d.id}','${parentType}','${parentId}')" style="background:transparent;border:1px solid ${C.danger}44;color:${C.danger};font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer">✕</button>`:''}
        </div>`).join('');
  return `
    <div id="docs-section-${parentType}-${parentId}">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <span>📎 DOCUMENTS (${list.length})</span>
      </div>
      <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px">${rows}</div>
      ${canWrite() ? `
      <input type="file" id="file-input-${parentType}-${parentId}" style="display:none" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" onchange="onFilePicked(event,'${parentType}','${parentId}')"/>
      <button onclick="document.getElementById('file-input-${parentType}-${parentId}').click()" style="background:rgba(232,151,10,.12);border:1px solid rgba(232,151,10,.35);color:${C.accent};font-size:13px;font-weight:700;padding:9px;border-radius:8px;cursor:pointer;width:100%;font-family:-apple-system,sans-serif">+ Ajouter un document</button>
      ` : ''}
    </div>
  `;
}

async function onFilePicked(event, parentType, parentId) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';  // reset input
  await uploadFile(file, parentType, parentId);
  // Re-render la section
  const container = document.getElementById(`docs-section-${parentType}-${parentId}`);
  if (container) container.outerHTML = renderDocsSection(parentType, parentId);
}

async function onDeleteDoc(docId, parentType, parentId) {
  const ok = await deleteDoc(docId);
  if (ok) {
    const container = document.getElementById(`docs-section-${parentType}-${parentId}`);
    if (container) container.outerHTML = renderDocsSection(parentType, parentId);
  }
}

    return st==='all' ? true : eq?.site===st;
  }).length;

  const filterBtns = [['all','Tous'],...SITES.map(s=>[s,s])].map(([val,lbl])=>{
    const on = site===val;
    const n = countSite(val);
    return `<button onclick="S.prevSite='${val.replace(/'/g,"\\'")}';render()" style="
      flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;

  }).join('');

  return `
    <div class="ph">
      <div><div class="pt">Plan Préventif</div><div class="ps">${list.length} gamme(s)${site!=='all'?` · ${esc(site)}`:''}</div></div>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch">${filterBtns}</div>
    <div class="sc"><input id="pv-search" class="si" placeholder="Rechercher…" value="${esc(S.search.prev)}" oninput="S.search.prev=this.value;render()"/></div>

    <div class="card" style="margin-top:10px">
      ${list.map(p=>{
        const eq=S.eq.find(e=>e.id===p.equipementId);
        const d=daysUntil(p.prochaineEcheance);
        const col=d===null?C.muted:d<=0?C.danger:d<=7?C.warning:d<=30?C.accent:C.success;
        return `<div class="ci" onclick="modalPrev('${p.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.tache)}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(eq?.nom||'—')}${eq?.site?` · ${esc(eq.site)}`:''}</div>
            <div style="margin-top:5px">${badge(p.frequence,C.info)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:10px">
            <div style="color:${col};font-family:monospace;font-size:13px;font-weight:700">${fmt(p.prochaineEcheance)}</div>
            <div style="color:${col};font-size:10px;margin-top:2px">${d===null?'':d<=0?`RETARD ${Math.abs(d)}j`:`J-${d}`}</div>
            <button class="bs" style="margin-top:7px;font-size:11px;padding:5px 10px" onclick="event.stopPropagation();marquerFait('${p.id}')">✓ Fait</button>
          </div>
        </div>`;
      }).join('')}
    </div>`}
    <div class="sp"></div>
    ${canWrite()?`<button class="fab" onclick="modalPrev(null)">+</button>`:""}`;
}

function marquerFait(id) {
  const p=S.prev.find(x=>x.id===id); if (!p) return;
  const eq=S.eq.find(e=>e.id===p.equipementId);
  openModal(`
    <div class="mh"></div>
    <div class="mhd"><span class="mt">✅ Valider — ${esc(p.tache)}</span><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${esc(eq?.nom||'—')} · ${p.frequence}</div>
      <div style="display:flex;gap:8px">
        <div class="fi" style="flex:1"><label class="fl">Début *</label><input class="inp" type="datetime-local" id="mf-debut"/></div>
        <div class="fi" style="flex:1"><label class="fl">Fin *</label><input class="inp" type="datetime-local" id="mf-fin"/></div>
      </div>
      <div class="fi"><label class="fl">Opérateur *</label><select class="sel" id="mf-tech">${operateurOptions(p.technicien)}</select></div>
      <button class="bp" onclick="confirmMarquerFait('${id}')">✓ Valider ce préventif</button>
    </div>
  `);
}

function confirmMarquerFait(id) {
  const p=S.prev.find(x=>x.id===id); if (!p) return;
  const debut = document.getElementById('mf-debut')?.value;
  const fin = document.getElementById('mf-fin')?.value;
  const tech = document.getElementById('mf-tech')?.value;
  if (!debut || !fin) { alert("Renseignez l'heure de début et de fin."); return; }
  if (new Date(fin) <= new Date(debut)) { alert("L'heure de fin doit être après l'heure de début."); return; }
  if (!tech) { alert('Sélectionnez un opérateur.'); return; }
  const dureeH = Math.round(((new Date(fin) - new Date(debut)) / 3600000) * 100) / 100;
  const d=new Date(); d.setDate(d.getDate()+(FREQ_DAYS[p.frequence]||30));
  const nextDate = jourOuvreProche(d.toISOString().split('T')[0]);
  const updated = {...p, dernierPassage:today(), prochaineEcheance:nextDate, dateDebut:debut, dateFin:fin, dureeH, technicien:tech};
  S.prev=S.prev.map(x=>x.id===id?updated:x);
  syncSave('prev', updated);
  closeModal();
  showToast('Préventif validé ✓', C.success);
  render();
}

// Coche/décoche toutes les machines d'un site dans la modale de gamme préventive
function togglePrevSite(btn) {
  const site = btn.getAttribute('data-site');
  const boxes = [...document.querySelectorAll(`.peq-multi[data-site="${CSS.escape(site)}"]`)];
  const allChecked = boxes.every(b=>b.checked);
  boxes.forEach(b=>b.checked = !allChecked);
  btn.textContent = allChecked ? 'Tout cocher' : 'Tout décocher';
}

// Ouvrir l'ajout de pièce prévue
function openAddPrevPiece(prevId) {
  const stocks = S.stock;
  if (stocks.length === 0) { alert('Aucune pièce en stock.'); return; }
  // Sauvegarder l'état du form
  window._prevFormState = {
    tache: document.getElementById('ptt')?.value || '',
    description: document.getElementById('pdesc')?.value || '',
    equipementId: document.getElementById('peq')?.value || '',
    frequence: document.getElementById('pfr')?.value || 'mensuel',
    technicien: document.getElementById('pte')?.value || '',
    dernierPassage: document.getElementById('pla')?.value || '',
    prochaineEcheance: document.getElementById('pne')?.value || '',
    observations: document.getElementById('pob')?.value || '',
    machinesChecked: Array.from(document.querySelectorAll('.peq-multi:checked')).map(cb => cb.value),
  };
  openModal(`
    <div class="mh"></div>
    <div class="mhd"><span class="mt">Pièce prévue</span><button class="mc" onclick="restorePrevForm('${prevId}')">×</button></div>
    <div class="mb">
      <div class="fi"><label class="fl">Pièce</label><select class="sel" id="addpp-piece">
        ${stocks.map(s => `<option value="${s.id}">${esc(s.designation)}</option>`).join('')}
      </select></div>
      <div class="fi"><label class="fl">Quantité prévue</label><input class="inp" type="number" min="1" id="addpp-qte" value="1"/></div>
      <button class="bp" onclick="saveAddPrevPiece('${prevId}')">Ajouter</button>
    </div>
  `);
}

function saveAddPrevPiece(prevId) {
  const pieceId = document.getElementById('addpp-piece').value;
  const qte = Number(document.getElementById('addpp-qte').value) || 1;
  window._prevPieces = window._prevPieces || [];
  window._prevPieces.push({ pieceId, quantite: qte });
  restorePrevForm(prevId);
}

function removePrevPiece(prevId, idx) {
  window._prevPieces = (window._prevPieces || []).filter((_, i) => i !== idx);
  if (prevId) {
    // Si édition d'un préventif existant, sauvegarder de suite
    const prev = S.prev.find(p => p.id === prevId);
    if (prev) {
      prev.piecesPrevues = [...window._prevPieces];
      S.prev = S.prev.map(p => p.id === prevId ? prev : p);
      syncSave('prev', prev);
    }
  }
  restorePrevForm(prevId);
}

function restorePrevForm(prevId) {
  closeModal();
  if (prevId) {
    // Si édition : mettre à jour piecesPrevues et rouvrir
    const prev = S.prev.find(p => p.id === prevId);
    if (prev) { prev.piecesPrevues = [...(window._prevPieces||[])]; }
    modalPrev(prevId);
  } else {
    // Si création : rouvrir et restaurer le state + piecesPrevues
    modalPrev(null);
    setTimeout(() => {
      const st = window._prevFormState || {};
      const set = (id, val) => { const e = document.getElementById(id); if (e && val !== undefined) e.value = val; };
      set('ptt', st.tache); set('peq', st.equipementId); set('pfr', st.frequence);
      set('pdesc', st.description);
      set('pte', st.technicien); set('pla', st.dernierPassage); set('pne', st.prochaineEcheance);
      set('pob', st.observations);
      // Restaurer les machines cochées
      (st.machinesChecked || []).forEach(eqId => {
        const cb = document.querySelector(`.peq-multi[value="${eqId}"]`);
        if (cb) cb.checked = true;
      });
      // Re-render piecesRows
      const f = { piecesPrevues: window._prevPieces || [] };
      const piecesRows = f.piecesPrevues.length === 0
        ? `<div style="font-size:12px;color:var(--muted);padding:8px 0">Aucune pièce prévue</div>`
        : f.piecesPrevues.map((pp, idx) => {
            const stk = S.stock.find(s => s.id === pp.pieceId);
            return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px"><div style="flex:1;font-size:13px"><div style="font-weight:600">${esc(stk?.designation || '(supprimée)')}</div><div style="font-size:11px;color:var(--muted)">${esc(stk?.reference||'')} · Qté: ${pp.quantite}</div></div><button onclick="removePrevPiece('', ${idx})" style="background:transparent;border:1px solid ${C.danger}44;color:${C.danger};font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer">✕</button></div>`;
          }).join('');
      const list = document.getElementById('prev-pieces-list');
      if (list) list.innerHTML = piecesRows;
    }, 50);
  }
}

// Calcule la prochaine échéance automatiquement (dernier passage + fréquence)
function updateEcheanceAuto() {
  const dp = document.getElementById('pla')?.value;
  const fr = document.getElementById('pfr')?.value;
  const elEch = document.getElementById('pne');
  if (!elEch || !dp) return;
  const d = new Date(dp);
  d.setDate(d.getDate() + (FREQ_DAYS[fr]||30));
  let nextDate = d.toISOString().split('T')[0];
  // Appliquer décalage jour ouvré
  nextDate = jourOuvreProche(nextDate);
  elEch.value = nextDate;
}

function savePrev(id) {
  const tache=document.getElementById('ptt').value.trim();
  if (!tache) { alert('Tâche obligatoire'); return; }
  let prochaineEcheance = document.getElementById('pne').value;
  const frequence = document.getElementById('pfr').value;
  const dernierPassage = document.getElementById('pla').value;
  // Si échéance vide mais dernier passage rempli, calculer auto
  if (!prochaineEcheance && dernierPassage) {
    const d = new Date(dernierPassage); d.setDate(d.getDate() + (FREQ_DAYS[frequence]||30));
    prochaineEcheance = d.toISOString().split('T')[0];
  }
  // Appliquer le décalage jour ouvré
  if (prochaineEcheance) prochaineEcheance = jourOuvreProche(prochaineEcheance);

  const base = {
    tache,
    description:document.getElementById('pdesc')?.value || '',
    frequence,
    technicien:document.getElementById('pte').value,
    dernierPassage,
    prochaineEcheance,
    observations:document.getElementById('pob').value,
    piecesPrevues: window._prevPieces || [],
  };

  if (id) {
    // Modification : une seule machine via le select
    const row = {...S.prev.find(p=>p.id===id), ...base, equipementId:document.getElementById('peq').value};
    S.prev = S.prev.map(p=>p.id===id?row:p);
    syncSave('prev', row);
    closeModal(); render();
    return;
  }

  // Création : récupérer toutes les machines cochées
  const checked = Array.from(document.querySelectorAll('.peq-multi:checked')).map(cb => cb.value);
  if (checked.length === 0) { alert('Cochez au moins une machine'); return; }

  checked.forEach(eqId => {
    const row = {id:uid(), ...base, equipementId:eqId};
    S.prev = [...S.prev, row];
    syncSave('prev', row);
  });
  closeModal();
  showToast(`${checked.length} gamme(s) créée(s)`, C.success);
  render();
}

function delPrev(id) {
  if (!confirm('Supprimer ?')) return;
  S.prev=S.prev.filter(p=>p.id!==id);
  syncDelete('prev', id); closeModal(); render();
}

  const list=S.stock.filter(s=>s.designation.toLowerCase().includes(q)||s.reference.toLowerCase().includes(q)||(s.categorie||'').toLowerCase().includes(q));
  const val=S.stock.reduce((a,x)=>a+x.quantite*x.prixUnitaire,0);

  return `

      <div>
        <div class="pt">Stock PDR</div>

      </div>
    </div>
    <div class="sc"><input id="st-search" class="si" placeholder="Rechercher…" value="${esc(S.search.stock)}" oninput="S.search.stock=this.value;render()"/></div>
    ${list.length===0?`<div class="empty"><div class="empty-i">📦</div><div>Aucune pièce en stock</div></div>`:`
    <div class="card" style="margin-top:10px">
      ${list.map(s=>{
        const al=s.quantite<=s.seuilAlerte;
        return `<div class="ci" onclick="modalSt('${s.id}')">

              ${s.categorie?badge(s.categorie,C.info):''}

            </div>
            <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.designation)}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(s.localisation)} · ${esc(s.fournisseur)}</div>

          <div class="qc" onclick="event.stopPropagation()">
            <button class="qb" onclick="adjStock('${s.id}',-1)">−</button>
            <span class="qv" style="color:${al?C.warning:C.success}">${s.quantite}</span>
            <button class="qb" onclick="adjStock('${s.id}',1)">+</button>
          </div>
        </div>`;
      }).join('')}
    </div>`}
    <div class="sp"></div>
    ${canWrite()?`<button class="fab" onclick="modalSt(null)">+</button>`:""}`;
}

function adjStock(id, delta) {
  const item = S.stock.find(s=>s.id===id); if (!item) return;
  const updated = {...item, quantite: Math.max(0, item.quantite+delta)};
  S.stock=S.stock.map(s=>s.id===id?updated:s);
  syncSave('stock', updated); render();
}

function modalSt(id) {
  const s=id?S.stock.find(x=>x.id===id):null;
  const isN=!s;
  const f=s?{...s}:{reference:'',designation:'',categorie:'',quantite:0,seuilAlerte:1,localisation:'',fournisseur:'',prixUnitaire:0,observations:''};

  openModal(`
    <div class="mh"></div>

    <div class="mb">
      <div class="g2">

        <div class="fi"><label class="fl">Catégorie</label><input class="inp" id="sc" value="${esc(f.categorie)}" placeholder="Joints…"/></div>
      </div>
      <div class="fi"><label class="fl">Désignation *</label><input class="inp" id="sd" value="${esc(f.designation)}" placeholder="Nom complet de la pièce"/></div>
      <div class="g2">
        <div class="fi"><label class="fl">Fournisseur</label><input class="inp" id="sf" value="${esc(f.fournisseur)}" placeholder="Nom"/></div>

      </div>
      <div class="g3">
        <div class="fi"><label class="fl">Qté</label><input class="inp" type="number" min="0" id="sq" value="${f.quantite}"/></div>
        <div class="fi"><label class="fl">Seuil min.</label><input class="inp" type="number" min="0" id="ss" value="${f.seuilAlerte}"/></div>
        <div class="fi"><label class="fl">PU (€)</label><input class="inp" type="number" min="0" step="0.01" id="sp" value="${f.prixUnitaire}"/></div>
      </div>
      <div class="fi"><label class="fl">Observations</label><textarea class="ta" id="so">${esc(f.observations)}</textarea></div>
      ${(!isN && canDelete())?`<button class="bd" onclick="delSt('${s.id}')">Supprimer cette pièce</button>`:''}
      ${canWrite()?`<button class="bp" onclick="saveSt('${isN?'':s.id}')">${isN?'Ajouter au stock':'Enregistrer'}</button>`:''}
    </div>`);
}

function saveSt(id) {
  const designation=document.getElementById('sd').value.trim();
  if (!designation) { alert('Désignation obligatoire'); return; }
  const d={designation,reference:document.getElementById('sr').value,categorie:document.getElementById('sc').value,fournisseur:document.getElementById('sf').value,localisation:document.getElementById('sl').value,quantite:Number(document.getElementById('sq').value)||0,seuilAlerte:Number(document.getElementById('ss').value)||0,prixUnitaire:Number(document.getElementById('sp').value)||0,observations:document.getElementById('so').value};
  const row = id ? {...S.stock.find(s=>s.id===id), ...d} : {id:uid(), ...d};
  if (id) S.stock=S.stock.map(s=>s.id===id?row:s);
  else S.stock=[...S.stock, row];
  syncSave('stock', row); closeModal(); render();
}

function delSt(id) {
  if (!confirm('Supprimer ?')) return;
  S.stock=S.stock.filter(s=>s.id!==id);
  syncDelete('stock', id); closeModal(); render();
}
